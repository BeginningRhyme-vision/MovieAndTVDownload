# ============================================================================
# 电影筛选配置文件
# ----------------------------------------------------------------------------
# 供 filter_to_ids.py 读取，用于决定从 movies.jsonl 中挑出哪些电影去下载。
#
# 【总原则】
#   - 每个筛选项都是一个独立开关，由它自己的 enabled 控制是否生效。
#   - enabled: false 时，该项完全不参与筛选（等于放行所有电影）。
#   - 本文件默认把所有开关都设为 false，因此默认【不做任何筛选】，
#     movies.jsonl 里所有带 tmdb_id 的电影都会被选中。
#   - 想启用某项筛选时，把对应的 enabled 改成 true，再调下面的参数即可。
#
# 【null（缺失值）如何处理】
#   有些老电影可能没有评分、没有票数、没有时长等（字段值为 null）。
#   每个涉及数值/内容的筛选项都有一个 keep_if_missing 开关：
#     - keep_if_missing: true  -> 该字段为 null 时，视为“通过本项筛选”（保留，默认）
#     - keep_if_missing: false -> 该字段为 null 时，直接排除这部电影
# ============================================================================


# ----------------------------------------------------------------------------
# title_type: 按条目类型筛选（对应 movies.jsonl 的 "title_type" 字段）
#   典型值只有 "movie"（本流水线上游已过滤成 movie，一般无需再开）。
#   开启后：只保留 allow 列表中的类型；不在列表中的一律排除。
# ----------------------------------------------------------------------------
title_type:
  # 是否启用本项筛选：true=启用，false=不筛选（默认）
  enabled: false
  # 允许保留的类型白名单；只有类型在此列表中的电影才会通过
  allow:
    - movie


# ----------------------------------------------------------------------------
# is_adult: 是否排除成人内容（对应 "is_adult" 字段，取值 true/false）
#   开启后：根据 exclude_adult 决定是否剔除成人电影。
# ----------------------------------------------------------------------------
is_adult:
  # 是否启用本项筛选：true=启用，false=不筛选（默认）
  enabled: false
  # true=排除掉 is_adult 为 true 的电影；false=保留成人电影
  exclude_adult: true


# ----------------------------------------------------------------------------
# start_year: 按上映年份筛选（对应 "start_year" 字段，整数）
#   开启后：只保留 min <= start_year <= max 的电影。
#   min 或 max 设为 null 表示该侧不设限（例如只设 min 就是“某年以后”）。
# ----------------------------------------------------------------------------
start_year:
  # 是否启用本项筛选：true=启用，false=不筛选（默认）
  enabled: false
  # 最早年份（含）；null 表示不限制下界。例：2000 表示 2000 年及以后
  min: 2000
  # 最晚年份（含）；null 表示不限制上界。例：2024
  max: null
  # 年份为 null（未知）时：true=保留，false=排除
  keep_if_missing: true


# ----------------------------------------------------------------------------
# runtime_minutes: 按片长（分钟）筛选（对应 "runtime_minutes" 字段，整数）
#   常用于剔除短片（片长过短）或异常超长条目。
#   开启后：只保留 min <= runtime_minutes <= max 的电影。
# ----------------------------------------------------------------------------
runtime_minutes:
  # 是否启用本项筛选：true=启用，false=不筛选（默认）
  enabled: false
  # 最短片长（含），单位分钟；null 表示不限。例：60 可过滤掉短片
  min: 60
  # 最长片长（含），单位分钟；null 表示不限。例：240
  max: null
  # 片长为 null（未知）时：true=保留，false=排除
  keep_if_missing: true


# ----------------------------------------------------------------------------
# rating: 按 IMDB 平均评分筛选（对应 "rating" 字段，浮点，0~10）
#   开启后：只保留 min <= rating <= max 的电影。
# ----------------------------------------------------------------------------
rating:
  # 是否启用本项筛选：true=启用，false=不筛选（默认）
  enabled: false
  # 最低评分（含）；null 表示不限。例：7.0 只要 7 分及以上
  min: 7.0
  # 最高评分（含）；null 表示不限
  max: null
  # 评分为 null（无人评分）时：true=保留，false=排除
  keep_if_missing: true


# ----------------------------------------------------------------------------
# votes: 按 IMDB 投票人数筛选（对应 "votes" 字段，整数）
#   票数太少往往是冷门片或刷分片，可用此项过滤。
#   开启后：只保留 min <= votes <= max 的电影。
# ----------------------------------------------------------------------------
votes:
  # 是否启用本项筛选：true=启用，false=不筛选（默认）
  enabled: false
  # 最少票数（含）；null 表示不限。例：10000
  min: 10000
  # 最多票数（含）；null 表示不限
  max: null
  # 票数为 null 时：true=保留，false=排除
  keep_if_missing: true


# ----------------------------------------------------------------------------
# genres: 按类型/题材筛选（对应 "genres" 字段，字符串列表）
#   include：只保留至少命中其中一个类型的电影（列表为空则不生效）。
#   exclude：命中其中任意一个类型的电影会被排除。
#   两者可同时使用；先按 include 收窄，再按 exclude 剔除。
#   常见值：Action, Comedy, Drama, Horror, Documentary, Short, Animation ...
# ----------------------------------------------------------------------------
genres:
  # 是否启用本项筛选：true=启用，false=不筛选（默认）
  enabled: false
  # 是否忽略大小写匹配类型名：true=忽略（推荐），false=严格区分
  case_insensitive: true
  # 白名单：电影的 genres 至少包含其中之一才保留；留空 [] 表示不做包含限制
  include: []
  # 黑名单：电影的 genres 命中其中任意一个就排除；留空 [] 表示不做排除
  exclude:
    - Documentary
    - Short
  # genres 为空/缺失时：true=保留，false=排除
  keep_if_missing: true


# ----------------------------------------------------------------------------
# directors: 按导演筛选（对应 "directors" 字段，姓名字符串列表）
#   开启后：只保留导演命中 include 列表中任意一人的电影。
# ----------------------------------------------------------------------------
directors:
  # 是否启用本项筛选：true=启用，false=不筛选（默认）
  enabled: false
  # 是否忽略大小写匹配姓名：true=忽略（推荐），false=严格区分
  case_insensitive: true
  # 需要命中的导演姓名列表（命中任一即保留）；留空 [] 时本项不生效
  include:
    - Christopher Nolan
  # 导演为空/缺失时：true=保留，false=排除
  keep_if_missing: false


# ----------------------------------------------------------------------------
# writers: 按编剧筛选（对应 "writers" 字段，姓名字符串列表）
#   规则同 directors。
# ----------------------------------------------------------------------------
writers:
  # 是否启用本项筛选：true=启用，false=不筛选（默认）
  enabled: false
  # 是否忽略大小写匹配姓名：true=忽略（推荐），false=严格区分
  case_insensitive: true
  # 需要命中的编剧姓名列表（命中任一即保留）；留空 [] 时本项不生效
  include: []
  # 编剧为空/缺失时：true=保留，false=排除
  keep_if_missing: false


# ----------------------------------------------------------------------------
# title_keywords: 按标题关键词筛选
#   同时匹配 "primary_title" 和 "original_title" 两个字段，任一命中即算命中。
#   include：标题需命中其中一个关键词才保留（列表为空则不生效）。
#   exclude：标题命中其中任意一个关键词就排除。
# ----------------------------------------------------------------------------
title_keywords:
  # 是否启用本项筛选：true=启用，false=不筛选（默认）
  enabled: false
  # 是否忽略大小写：true=忽略（推荐），false=严格区分
  case_insensitive: true
  # 是否把关键词当正则表达式处理：true=正则匹配，false=普通子串包含（默认）
  use_regex: false
  # 标题需包含其中之一才保留；留空 [] 表示不做包含限制
  include: []
  # 标题命中其中任意一个就排除；留空 [] 表示不做排除
  exclude: []
