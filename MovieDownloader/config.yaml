# ============================================================================
# MovieDownloader 项目统一配置文件
# ----------------------------------------------------------------------------
# 【设计约定】
#   - 本文件按“代码文件”分段：每个顶层键对应一个 .py 脚本，段名与脚本文件名
#     （去掉 .py）一致。
#   - 每个脚本运行时只读取自己对应的那一段，互不干扰。
#   - 想改某个脚本的参数，只需改它所属段落，无需改动任何代码。
#
# 【接入进度】
#   - fetch_movie_metadata / filter_to_ids / tmdb_ids_to_links / download_movies
#     四段均已接入，对应脚本运行时会读取自己那一段。
#   - fetch_subtitles 段**部分接入**：该脚本从 .env 读 SUBDL_API_KEY，并读取
#     download_movies 段的 base_dir / folder_prefix / success_log（字幕与视频
#     落在同一影片目录，路径必须同源）；本段其余字段仍为预留。
#   - filter_to_ids 的**筛选规则**不在本文件，而在同目录 filter_config.yaml；
#     本文件的 filter_to_ids 段只管输入输出路径。
# ============================================================================


# ----------------------------------------------------------------------------
# fetch_movie_metadata.py —— 抓取 IMDB 全量电影元数据并转换 TMDB ID
# ----------------------------------------------------------------------------
fetch_movie_metadata:
  # TMDB API Key：敏感项，请配置到同目录 .env 的 TMDB_API_KEY（见 .env.example）。
  # 环境变量优先；此处留空，仅作本地调试回退。生产环境务必留空。
  tmdb_api_key: ""

  # 只保留哪些 IMDB 条目类型（title.basics 的 titleType 列）。
  # IMDB 实际有 11 种：movie / short / video / videoGame / tvSeries / tvMiniSeries
  # / tvSpecial / tvShort / tvEpisode / tvMovie / tvPilot。
  #
  # tvMovie（电视电影）：单文件、无季集结构，TMDB Find 把它归到 movie_results
  # 而非 tv_results，所以 TVDownloader 有意排除它、由本子任务接收
  # （本脚本取的正是 movie_results 桶，天然吃得下）。此前两边都没收，它掉在缝里。
  #
  # ⚠️ 若日后启用 filter_config.yaml 的 title_type 筛选（默认 enabled: false），
  # 必须把 tvMovie 一并加进它的 allow 列表，否则这里收进来的又会被那边筛掉。
  #
  # 增量说明：progress.txt 只记已处理的 imdb_id，新增类型的条目下次运行会自动
  # 补跑，无需清空进度或重跑已完成的部分。
  keep_types:
    - movie
    - tvMovie

  # 调用 TMDB API 的并发线程数。TMDB 软上限约 50 req/s，配合 sleep 控制整体 QPS
  max_workers: 16

  # 每次调用 TMDB API 后的固定间隔（秒），用于降低触发限速的概率
  # 16 并发 + 0.1s 约对应 100 QPS（配合 Session 连接复用压测）；若日志出现 429 可调大到 0.2
  sleep: 0.1

  # ---- 以下为文件路径，一般无需修改 ----
  # IMDB 数据集与 SQLite 索引库所在目录
  data_dir: "imdb_data"
  # 最终输出的电影元数据文件（下游 filter_to_ids.py 的输入）
  output: "movies.jsonl"
  # 断点续跑的进度记录文件（记录已处理的 imdb_id）
  progress: "progress.txt"
  # 运行日志文件
  log_path: "fetch.log"


# ----------------------------------------------------------------------------
# filter_to_ids.py —— 按条件从 movies.jsonl 挑片，生成取流用的 ids.txt
# ----------------------------------------------------------------------------
# 注意：**筛选规则本身不在这里**，而在同目录的 filter_config.yaml
# （每个字段一个独立开关，项目多、注释长，单独成文件更好维护）。
# 本段只管该脚本的输入输出路径。
filter_to_ids:
  # 输入：fetch_movie_metadata.py 的产物
  input: "movies.jsonl"
  # 筛选规则文件（各字段的 enabled 开关与阈值都在里面）
  filter_config: "filter_config.yaml"
  # 输出：每行一个 tmdb_id，供 tmdb_ids_to_links.py 消费（覆盖写）
  output_ids: "ids.txt"
  # 输出：通过筛选的电影明细，仅供人工复核，无下游消费者（覆盖写）
  output_detail: "filtered.jsonl"


# ----------------------------------------------------------------------------
# tmdb_ids_to_links.py —— 由 tmdb_id 解析出可播放的 m3u8 地址
# ----------------------------------------------------------------------------
tmdb_ids_to_links:
  # 输入：待解析的 tmdb_id 列表（filter_to_ids.py 的产物）
  input: "ids.txt"
  # 影片静态元数据源（fetch_movie_metadata.py 的产物）。取流成功时按 tmdb_id 查表，
  # 把 year/original_title/runtime_minutes/genres/title_type/imdb_id 合并进 output，
  # 供下游 download_movies 拼 R2 路径 {year}/... 及后续用途。缺失则各字段留空。
  metadata: "movies.jsonl"
  # 输出：解析成功的结果（含 m3u8 地址）
  output: "results.jsonl"
  # 确认真无源的 tmdb_id 记录（每行一个）。**语义是"永久排除，绝不再抓"**：
  # 只有走完白名单判死（唯一证据是源站明确表示无此片）+ dead_confirm 换 IP
  # 二次确认的 ID 才会进来。它会被计入"已处理"，续跑时直接跳过。
  # 也正因为语义纯净，它才能被当作"真 dead 样本"用于评估新增源的价值（见 §10.15）。
  fail_file: "fail.txt"
  # 多轮捞回跑满 max_rounds 仍未成功、且**从未被判定为无源**的 tmdb_id。
  # 这些是被超时/5xx/代理或 enc-dec 故障打下来的，不是真没源，因此：
  #   - 不计入"已处理"，下次运行会自动重试；
  #   - 与 fail_file 分开存放，避免一次长时间的基础设施故障把整批有源片永久判死，
  #     也避免两类记录混在一起后再也分不出哪些是真 dead。
  # 每次运行结束覆盖写（含清空），始终只反映最近一次运行的残留。
  unresolved_file: "unresolved.txt"
  # ---- 闭环修复：重取下载侧判定“直链已失效”的影片 ----
  # vidlink 出的是带时效签名的 mp4 直链，过期后下载侧拿到 403/410，判死并写进
  # download_movies.failed_log。但那些 id 当初取流是成功的、已在 results.jsonl 里，
  # 本脚本的“已处理即跳过”会让它们永远拿不到新链接——这条闭环原本是断的。
  #   python tmdb_ids_to_links.py --refetch-failed
  # 该命令扫 failed_log 挑出带“需重新取流”标记的 id 强制重取（绕过已处理判断），
  # 结果追加写入 results.jsonl，下载侧按 fetched_at 择新自动选用，无需清理旧行。
  # 注意：光重跑主命令没用，那些 id 会被当作已处理跳过。
  # 解密服务 API 根地址（负责各 provider 的 enc-* / dec-* 加解密）
  api: "https://enc-dec.app/api"
  # ---- 多源取流 ----
  # 按顺序逐家取流，把各家给出的 url 全部汇总进 urls 数组（按 url 去重、保持此处顺序），
  # 下载侧按节点顺序逐个尝试；任一家给出 url 即算成功。
  #
  # 2026-09-08 对 348601 部 vidup 判死影片做了两批各 300 部、样本零重叠的分层抽样实测
  # （详见 AGENTS.md §10.12 / §10.13）。合并 600 部的结论：
  #   videasy 8.5%（独占 17，-2.8pp） vidfast 5.7%（独占 0） vidlink 5.5%（独占 14，-2.3pp）
  #   ANY 10.8%   vidup 复探 0 命中（证明判死可靠，增量都是真增量）
  # 注意：与 TVDownloader 的结论相反（那边 vidlink 是主力、videasy 与 vidfast 完全重合）。
  #
  # 各家去留依据（两批数据一致）：
  #   videasy 必留：两批都有独占（11 / 6），合并 17 部。
  #   vidlink 必留：两批都有独占（5 / 9），合并 14 部；且是唯一独立片库——url 全为
  #                 hakunaymatata.com，与 peakstorm 系 19 部共同命中中 url 相同 0 部，
  #                 且出 mp4 直链形成形态互补。
  #   vidfast **已于 2026-09-09 摘除**（四次独立验证零独占）：两批（各 300 部）
  #                 独占均为 0；500 部实跑中它只"贡献"1 部成品（84508），而逐
  #                 provider 复验发现 videasy 对同一片给出的 url **逐字相同**
  #                 （376 字符全等）——不是"videasy 也有"，是**同一个后端**，
  #                 vidfast 只是另一个前端入口。
  #                 成本侧：每部无源片要探它 7 个 server，374 部无源 ≈ 2600 次
  #                 无效请求（全走住宅代理），约占取流耗时 15-25%。
  #                 ⚠️ 要恢复只需把 vidfast 加回下面这行，代码无需改动。
  #   ⚠️ videasy 与 vidlink 的相对强弱随样本波动（batch1 是 11:5，batch2 反过来是 6:9），
  #      不要用单批数据判断谁更重要；但 vidfast 的 0 从未波动。
  # 可用 --providers a,b 在命令行覆盖，便于单独验证某一家的实际贡献。
  providers: [vidup, videasy, vidlink]
  # 并发线程数：同时解析多少个 tmdb_id。配合住宅代理分散 IP。
  # 提速优化：无源404已改为不重试（省2/3请求），任务变纯IO等待，可拉高并发；50 实测更稳
  max_workers: 50
  # 单个 id 的最大重试次数与每次重试间隔（秒）
  # 白名单判死：只有源站明确表示无此片（vidup/vidfast 页面 404 或全部 server 的 stream 404、
  # vidlink 返回 null、videasy 全部 server 空）才算真无源；其余任何错误（SSL/超时/5xx/
  # 解密服务异常/结构异常）一律视为瞬时，重试后进入多轮捞回。
  max_retries: 3
  retry_delay: 1
  # 判死二次确认：首次无源只算"疑似"，换出口 IP 再把所有 provider 完整探一次，
  # 连续两次全家无源才写 fail.txt，防 CDN/代理抖动把有源片永久误判丢失；
  # 命中过无源的片重试预算 +1。false 则单次无源即判死。
  dead_confirm: true
  # ---- 多轮捞回：整批跑完后对“瞬时耗尽”的 ID 自动重跑，直到清零或达上限 ----
  # 进程内不定轮循环，替代旧的外部 retry_runner.sh：
  #   - 单 ID 在 process_tmdb_id 内换 IP 重试 max_retries 次仍失败(瞬时耗尽) → 下一轮重跑；
  #   - 确认真无源 → 写 fail_file，永久排除，绝不再抓；
  #   - output 直接就是全部轮次成功结果的合并（原 total_results.jsonl）。
  # max_rounds 为兜底上限（含第一轮），防极端情况死循环。
  # 达上限仍未成功的 ID 写 unresolved_file，**不判死**，下次运行自动重试。
  max_rounds: 8
  # 轮间退避（秒）：第 n 轮后等待 round_backoff*n，上限 round_backoff_max。
  # 给 enc-dec / 代理 / 源站的短时故障留恢复窗口，避免多轮在几秒内烧光重试预算。
  # 某轮"待重跑"占比 ≥90% 且数量 ≥50 时判定为基础设施故障，直接等满上限。
  round_backoff: 30
  round_backoff_max: 300
  # 跑满 max_rounds 仍未捞回的 ID 直接写 unresolved_file、留给下次运行自动重试，
  # 进程内不再做长冷却重试（曾有 30 分钟级"加时赛"，已取消，与下载侧的跨运行重试对齐）。
  # 单个 HTTP 请求超时（秒）。启用 Session 连接复用后握手更快。
  # 分阶段实测：正常各阶段中位 0.5~3.7s、单请求 P90≈15s、取流循环 max≈13s，
  # 20s 给卡死请求留太久空耗线程；降到 12s 可让长尾/卡死请求早 3~8s 放弃，
  # 且仍高于所有正常阶段的 max，不会误杀正常较慢响应。
  timeout: 12
  # 代理配置：vidup.to 有 Cloudflare 机房 IP 拦截，直连会 403，需走住宅代理。
  # 敏感项 user/password 请配置到同目录 .env 的 PROXY_USER / PROXY_PASSWORD（见 .env.example）。
  # 环境变量优先；此处 user/password 留空，仅作本地调试回退。生产环境务必留空。
  proxy:
    # true=启用下方代理，false=直连
    enabled: true
    host: "unmetered.residential.proxyrack.net"
    user: ""
    password: ""
    # 端口范围 [起, 止]，每次请求随机取一个端口以更换出口 IP
    port_range: [9000, 9050]


# ----------------------------------------------------------------------------
# download_movies.py —— 下载 m3u8 并转封装为 mp4
# ----------------------------------------------------------------------------
download_movies:
  # 输入与日志
  # 直接消费取流产物 results.jsonl（自带 year/runtime_minutes 等元数据，见 §8.8）。
  input: "results.jsonl"
  success_log: "success.jsonl"
  failed_log: "failed.jsonl"
  # ---- 多轮下载：对因瞬时错误(5xx/超时/SSL/缺片等)下载失败且可重试的影片自动重跑 ----
  # 确定性失败（404/无源、画质不达标、缺 tmdbId/url）绝不进入下一轮，避免白费流量。
  multi_round:
    enabled: true           # false=只跑一轮（等价旧行为）
    max_rounds: 3           # 最大下载轮次（含第一轮）
    # 轮次之间的冷却等待（秒）。原意是"等源站风控解除"，但 200 部首跑实测
    # （AGENTS.md §12.11 E）403/429 风控**一次都没触发**，失败主因是 502
    # （1470 次）——那是源站容量问题，冷却再久也不解决。300s 三轮共 10 分钟
    # 纯空转（占总时长 13%），故降到 60s：既保留短抖动的恢复窗口，又不再
    # 为不存在的风控买单。真遇到风控（403/429 大量出现）时再调回。
    cooldown_seconds: 60
    # 【源站回源故障专用的长冷却（秒）】**默认 0 = 关闭分档**，所有轮次统一
    # 走上面的 cooldown_seconds。
    #
    # 这里曾设 1800s，理由是"整节点采样全挂"多为单节点片、只能等源站恢复。
    # 2026-09-12 的 run4 实测把这个设计推翻了：
    #   - 同一批实测测出这类故障恢复是**小时级**（约 4 小时后 3 部里 2 部才好），
    #     1800s 只有 0.5 小时，**既跨不过故障窗口、又比 60s 多烧 29 分钟**；
    #   - run4 的账：长档触发 → 干等 30 分钟 → 第 2 轮投 75 部**只救回 2 部**
    #     （第 1 轮同期是 99 部）。
    # 结论：这些片交给**跨运行重试**更划算 —— 下次运行时往往已过去几小时，
    # 恰好落在源站真正恢复的窗口里，而本次不必干等。
    #
    # 什么时候该调回非 0：确认源站是"短时抽风、几分钟就好"的那种故障时，
    # 设几百秒仍有意义。判据函数 is_source_outage 与整条接线都还在。
    source_outage_cooldown_seconds: 0
  # ---- 轮次间就地重取流（直链过期自愈）----
  # vidlink 给的是带时效签名的 mp4 直链。取流到下载之间隔得久了，直链会 403/410
  # 过期；重投同一条 url 必然再挂，故按确定性失败处理、不进下一轮。
  # 开启本项后，每轮结束时就地调用取流侧 provider 换一批新 url 再重投，等价于人工跑
  # `tmdb_ids_to_links.py --refetch-failed` 后重跑本脚本，只是发生在同一次运行内。
  #   - 新 urls 会追加写入 input(results.jsonl)，下次运行按 fetched_at 自动择新；
  #   - 只对"需重新取流"这一类失败生效，画质不达标等确定性失败不会白烧取流配额；
  #   - 末轮不重取（拿到新链接也没有轮次去用了）。
  # enabled: false 时行为与旧版一致（只在收尾打印提示，等人工处理）。
  # 手动入口始终保留：python tmdb_ids_to_links.py --refetch-failed
  #
  # 🔴 2026-09-11 起关掉它的代价显著变大（§12.27）：
  # 此前"需重新取流"只出现在 **mp4 直链**的 403/410 上，量很小。现在 m3u8 链路
  # （master playlist / media playlist / 分片）的 401/403/410 也会挂这个标记——
  # 因为 m3u8 的地址同样带时效 token，过期后不挂标记就永远进不了重取闭环，
  # 跨运行重试会因大批 token 过期而失去意义。
  # 副作用：该标记同时在 _PERMANENT_FAILURE_MARKERS 里 → 带它的失败 retriable=False。
  # 于是 enabled: false 时，**m3u8 的 401/403/410 会当轮直接放弃**（既不重投也不
  # 重取），只能靠人工跑 --refetch-failed 捞回。而 403 有时只是源站临时风控、
  # 冷却一轮就恢复。
  # → 除非你确实要把过期处理完全交给人工，否则**保持 enabled: true**。
  auto_refetch:
    enabled: true
    max_per_movie: 2        # 单部片整次运行中最多就地重取几次（防"取流-过期-重取"空转）
    workers: 8              # 重取并发数。取流走代理且与下载争带宽，故远小于取流侧独立运行时
    # 单轮重取的总耗时上限（秒）。重取由主事件循环线程同步执行，期间不再推进
    # 转封装/上传：已下载完的成品会在 temp 里堆积、上传反压链条僵住。
    # 全量重跑时一轮几百部过期很正常，而单片取流要跑 4 个 provider × 多 server ×
    # timeout × max_retries，足以拖住主循环几十分钟（与 upload_slot_wait_timeout
    # 防的是同一类问题）。超时即收下已完成的部分、放弃仍在跑的，留给下次运行。
    round_timeout_seconds: 600
    # 【仅 pipeline.py】异步重取投出后，等待结果回来的上限（秒）。
    # pipeline 模式下重取由常驻取流线程异步跑，主循环 dispatch 完立刻返回。
    # 但投完必须等一等再判"还有没有片要重投"——否则会认为没有、直接收尾，
    # 重取成功的新链接就没有任何轮次去消费它（端到端实测复现过）。
    # 期间每秒收一次，在途清零即提前结束，不会白等满。
    # 单独跑 download_movies.py 时本项无效（那条路走上面的同步重取）。
    async_wait_seconds: 120
    # 【直链绝对过期判定（秒）】results.jsonl 里的条目躺过这么久，**启动时**
    # 就先换新链接再下载，不等它下载失败了才发现。
    #
    # 此前 fetched_at 只用于同一 ID 多行之间的相对择新，从不与当前时间比较。
    # 跨运行间隔几天时整个 results.jsonl 都是陈旧的，每部片都要先完整地失败
    # 一次（跑满超时与重试）才触发重取 —— 白烧的是时间和带宽。
    #
    # 🔑 24 小时是经验阈值，不是源站的硬性规定。所以**重取无果时仍会拿旧链接
    # 试一次**，绝不因为"判定为陈旧"就放弃：旧链接未必真失效，而没配代理凭证
    # 的机器压根取不了流，丢弃等于整批片全军覆没。本项只可能让结果变好。
    # 设为 0 关闭该判定（退回旧行为：只在下载失败后才重取）。
    stale_after_seconds: 86400
  # ---- 收尾自动补传 ----
  # 上传槽位等待超时（upload_slot_wait_timeout）会降级为"留本地 + 写 upload_pending"，
  # 这些成品不被任何后续轮次处理，只能靠人跑 reupload。主流程跑完时 R2 往往已恢复，
  # 自动补一次能省掉这次人工介入。主流程异常退出时不自动补传（状态未知，交人工判断）。
  # 手动入口始终保留：python download_movies.py reupload
  auto_reupload:
    enabled: true
  # ---- failed.jsonl 归档轮转 ----
  # failed.jsonl 是纯追加、永不清理的（唯一的删除只针对 stage=="upload"）。
  # run3 一轮就写了 245KB，全量几十万部时 `--refetch-failed` 每次都要整个读一遍。
  #
  # 超过 max_bytes 就在**运行收尾时**轮转：整个文件移进 archive/failed_<时间戳>.jsonl，
  # 再把仍待重取的行原样写回一个新的 failed.jsonl。
  #
  # 🔑 为什么要回填而不是简单移走：`--refetch-failed` 靠"文件里有带『需重新取流』
  # 标记的行"来挑待重取的片。整体移走会让这批片再也挑不出来，重试链当场断裂 ——
  # 那是直接牺牲下载成功率。回填后新文件只剩这些片（极少），
  # 历史则一条不丢地留在 archive/ 里，事后分析照样可用。
  # max_bytes: 0 关闭轮转。archive/ 目录可自行清理，不影响任何业务逻辑。
  failed_log_rotation:
    max_bytes: 104857600    # 100MB
  # 两个独立于 success.jsonl/failed.jsonl 的下载态状态文件，全程可查当前下载进度：
  #   download_ok_log   —— 累计追加，每部“下载”成功一条（不含转封装/上传）
  #   download_fail_log —— 每轮开头清空重写，只记本轮“下载”失败的影片
  download_ok_log: "download_ok.jsonl"
  download_fail_log: "download_fail.jsonl"
  # 【画质判死账本】累计追加，记"因画质被确定性判死"的片 + 当时的判定依据。
  # 启动时并入跳过集，避免每次重跑都把注定失败的片重新采样、重新判死一遍
  # （2026-09-11 实跑：74 部判死片白跑约 2000 次分片下载，结论与上次完全一致）。
  #
  # ⚠️ 与 fail.txt 语义完全不同，勿混用：
  #   fail.txt          = 取流侧"源站明确说没有这部片"，永久排除；
  #   download_dead_log = "有源但画质不达标"，门槛调松后可用 --retry-dead 放回。
  #
  # 想让全部判死片重新参与下载：删掉此文件，或用 --retry-dead 按新门槛自动筛。
  download_dead_log: "download_dead.jsonl"
  # --retry-dead 放回判死片的余量系数：要求 新门槛 × 本值 <= 当时实测码率。
  # 为什么要留余量：实测码率是"那次采样窗口"的值、本身有波动。门槛恰好压在
  # 记录值上就放回的话，重新采样很可能测出略低的值又被判死，形成来回震荡、
  # 每轮都白跑。1.05 = 门槛要比记录值低 5% 以上才放回。设 1.0 = 不留余量。
  dead_revive_margin: 1.05
  # 视频落盘根目录与临时工作目录。
  # 支持三种写法：
  #   1) 相对路径（如 downloads）—— 以脚本所在目录 MovieDownloader/ 为根，
  #      故默认值即项目下的 MovieDownloader/downloads 与 MovieDownloader/temp，
  #      随项目 clone 位置自动跟随；
  #   2) 绝对路径（如 /mnt/data/downloads）—— 直接使用该路径；
  #   3) 两者建议放在同一磁盘，成品从 temp_dir 移到 base_dir 才是瞬时操作。
  base_dir: "downloads"
  temp_dir: "temp"
  # 媒体类型命名空间：本地与 R2 对象键的**第一层目录**，用于在同一个桶里区分
  # 电影与剧集（电影 movies、剧集 tvs）。两侧同时使用同一个值，故：
  #   本地  {base_dir}/movies/{发布年份}/{tmdbId}/{tmdbId}.mp4
  #   R2    {s3.prefix}/movies/{发布年份}/{tmdbId}/{tmdbId}.mp4
  # 两侧严格同构 —— 本地路径与对象键可以互相换算，同一部片的视频、元信息
  # (meta.json)、字幕 (subs/) 全部落在同一个 {tmdbId}/ 目录下，便于前端按
  # 同前缀一次列举取全。
  # ⚠️ 改这个值不会迁移已落盘/已上传的文件，只对之后的新文件生效。
  folder_prefix: "movies"
  # ---- 元信息与字幕（与视频落在同一个影片目录下）----
  # 每部片除 {tmdbId}.mp4 外还会产出：
  #   meta.json     影片元信息（取流侧已有字段 + 本次实测的分辨率/码率）
  #   subs/{lang}.vtt / subs/{lang}.srt   外挂字幕（来自 vidlink 的 captions）
  # 两者都是"锦上添花"：获取或写入失败只记日志，**不影响整片成败**——
  # 一部已下好的片不该因为元信息这种小事被判失败而重跑整个下载。
  assets:
    # 是否生成 meta.json
    meta_enabled: true
    # 是否抓取取流侧带回的外挂字幕（results.jsonl 的 captions 字段）
    subtitles_enabled: true
    # 要保留的字幕语种（语言代码）。取流侧给的其它语种一律丢弃，避免
    # 单片存下十几种语言、白白放大存储与上传请求数。
    subtitle_languages: ["en", "zh"]
    # 同时保留 VTT 与 SRT：浏览器原生 <track> 只吃 WebVTT，而多数本地播放器
    # 以 SRT 为主。字幕体积极小（几十 KB），两份都存的代价可忽略。
    subtitle_formats: ["vtt", "srt"]
    # 单个字幕文件的下载超时（秒）与大小上限（字节）。
    # 上限是防御性的：字幕正常只有几十 KB，若源站把一个视频/错误页塞过来，
    # 不设限会把它整个读进内存。
    subtitle_timeout: 30
    subtitle_max_bytes: 5242880
  # 并发控制
  max_workers: 32          # 同时下载的影片数
  # 主循环同时持有的「下载 future」上限（分批投递深度）。必须 > max_workers，
  # 否则下载池喂不满。一次性把整轮几十万部全投进 pending 会让 wait() 每次对全部
  # 未完成 future 挂/摘 waiter，主循环退化成 O(N²)；分批后 wait 规模恒定。
  # 留空/不配时默认 max_workers × 2。
  download_queue_depth: 64
  # 流式来源（§12 取流↔下载重叠）下，「在途任务已排空但取流还没产出新片」时的
  # 轮询间隔（秒）。只有这一种情况才会 sleep——此刻主循环无事可做，不让出 CPU
  # 就是 100% 空转。取流侧产出约 4.6 部/分钟，2s 粒度远不构成瓶颈。
  # 单独跑 download_movies.py（非 pipeline 模式）时这段逻辑永不触发。
  stream_idle_poll_seconds: 2
  # pipeline.py（取流↔下载同进程重叠）专用。仅 `python pipeline.py` 读取，
  # 单独跑 tmdb_ids_to_links.py / download_movies.py 时完全无影响。
  pipeline:
    # 取流→下载的队列容量（部）。满了之后取流侧入队会阻塞，天然形成反压。
    # 取流才是瓶颈（~4.6 部/分钟 < 下载 ~6.4 部/分钟），队列长期偏空，
    # 这个上限基本碰不到——它是保险丝，不是主调节手段。
    #
    # ⚠️ 队列里每一条都是**等待下载的签名直链**，vidlink 的 mp4 直链带时效：
    # 容量越大 = 取流可以跑在下载前面越多 = 队首那条等得越久。
    # 故本值真正决定的不是吞吐（正常时队列本就偏空、两个取值表现一样），
    # 而是**下载侧出故障积压到上限时，最坏能坏到什么程度**。
    #   512  ≈ 1.9 小时产出量（当前值）
    #   1024 ≈ 3.7 小时产出量
    # 512 同时是 download_queue_depth(64) 的 8 倍——缓冲足够厚（下载侧要连续
    # 消化 8 批才见底），又不至于囤到时效危险区。
    #
    # 📌 若发现队列频繁打满：正确的反应是查"下载侧为什么跟不上"，
    # **不是**把本值调大——调大只会让更多直链一起等到过期。
    queue_maxsize: 512
    # 队列满时，取流侧单条入队的最长等待（秒）。
    # 超时只是**推迟**不是丢失：结果早已落盘 results.jsonl（落盘先于入队），
    # 下次运行照样读得到，只是本次运行的下载侧看不到它。
    # 必须有上限——写成无限等会让取流线程在队列满时永久挂死，Ctrl+C 都退不出去。
    # 按设计它基本不该触发；若日志里频繁出现，说明"取流是瓶颈"的前提不成立了，
    # 那是要重新审视架构的信号，而不是把这个值调大。
    enqueue_timeout_seconds: 120
  # 独立的 FFmpeg 转封装线程数。转封装是 `ffmpeg -c copy` 纯 IO 拷贝，并发过高
  # 只会在同一块盘上互抢 IO，吞吐不升反降。
  convert_workers: 8
  segment_concurrency: 64  # 单部影片同时下载的分片数
  # 画质探测与分片重试
  # 从影片"正中间"连续取 sample_count 段测码率，采样片测完即删、不复用为正片开头
  # （片头常是 logo/黑场/字幕卡等低动态画面，码率系统性偏低，会误杀压线的合格片）。
  # 代价是入选片多下这 sample_count 段，换取判定不被片头拉偏。
  # 跳过规则：候选按声明高度降序试，一旦某流入选，后续「已声明分辨率且严格低于
  # 已选中高度」的流不再采样（必然落选）。未声明分辨率的流仍会采样后 ffprobe。
  sample_count: 10
  seg_retry_max: 20
  seg_retry_delay: 1
  # 采样阶段的单分片重试上限，**刻意远小于** seg_retry_max。
  # 采样只是为了"测个码率决定这条流要不要下"，探不到就该立刻换下一条流/节点；
  # 正片下载死磕 20 次才值得（已投入大量带宽，半途而废等于全白下）。
  #
  # 🔴 2026-09-09 服务器实跑教训：源站持续吐 400/502（两者都不在确定性失败
  # 白名单里，故每片必须走满重试），一部片 = N 条候选流 × 10 个采样分片 ×
  # 20 次重试、退避第 7 次起封顶 60s —— 10 部片在采样阶段空转 90 分钟仍无结论。
  #
  # 3 → 5（2026-09-10）：原先的 3 是在 urllib3 还会**静默重试 2 次**的前提下
  # 定的——那时一次循环底下实际有 3 个请求，3 次循环≈9 个请求。现在已把
  # 状态码重试全部收归上层（见代码 get_session 的注释），一次循环就是 1 个
  # 请求，3 次就真的只试 3 次，对源站几秒级抖动容错太弱、会压低成功率。
  # 提到 5 后实际请求数 5 < 改动前的 9，成本仍是降的；退避 1+2+4+8≈15s
  # 足以跨过短抖动，又远低于正片那套。
  sample_seg_retry_max: 5
  # 转封装(ffmpeg -c copy)单片超时(秒)：纯拷贝通常几十秒完成，给足冗余；
  # 防坏 TS/fMP4 让 ffmpeg 无限阻塞占死转封装线程。超时判失败(下次续跑重来)。
  convert_timeout: 1800
  # ---- playlist(master/media)解析阶段的请求重试 ----
  # 源站临时 5xx 抽风时，这一层若过早放弃会直接判整部影片失败。
  # 给足重试次数与退避上限，扛过几十秒级故障。
  playlist_retry_max: 10          # 单节点 playlist 解析最大重试次数
  playlist_retry_backoff: 1.0     # 退避基础间隔（秒，指数退避）
  playlist_retry_backoff_max: 60.0  # 退避间隔上限（秒）
  # 方案C 多节点 fallback：非末节点用更小的重试次数快速判定坏节点并换下一个备用节点；
  # 末节点/单节点仍用 playlist_retry_max 死磕。
  playlist_retry_fallback: 3
  # ---- mp4 直链下载（vidlink 等 type=mp4 的取流条目）----
  # 按 Range 分块并发下载，单块失败按 seg_retry_max/seg_retry_delay 重试；不做断点续传
  # （残留文件视为脏数据整段重下，启动时 temp_* 也会被清理）。
  # 请求头使用取流阶段记录的 headers（如 okhttp UA），并去掉 Session 默认的 Referer/X-Requested-With。
  # 直链 403/410 视为签名过期，标记“需重新取流”；它与非 206 / 404 / 416 /
  # 首块非视频内容一样属确定性失败——本脚本读的是固化的 results.jsonl，没有
  # 重新取流的能力，多轮重投拿到的还是同一条 url，必然再挂。故一律不重试、
  # 直接换下一个节点，并留在 failed.jsonl 里等重跑 tmdb_ids_to_links.py 修复。
  # 内存估算：每部片最多 (mp4_concurrency 在途 + 2×mp4_concurrency 已下完待落盘) × mp4_chunk_size
  #   ≈ 3 × 8 × 8MB = 192MB；全局上限再乘 max_workers（32 → 约 6GB，仅在所有 worker 同时
  #   跑 mp4 直链且乱序严重时才会逼近）。内存紧张时优先调小 mp4_concurrency 或 mp4_chunk_size。
  mp4_chunk_size: 8388608   # 单块大小（字节），默认 8MB
  mp4_concurrency: 8        # 同一部片内并发块数
  # 【CDN 主机级熔断】某台直链主机累计多少次 429 后，本次运行内跳过它的全部
  # mp4 节点。2026-09-10 实测确诊：hakunaymatata 的 bcdnxw 整机故障——换 3 个
  # 住宅 IP、换新签名、冷却 30s 后**恒定** 429（Server 头是 nginx，而正常的
  # bcdn/hcdn3 是 Tengine），当次 341 条 vidlink url 有 153 条指向它。
  # 没有熔断时每片都要把这台坏主机重试一遍、还跨 3 轮，纯属空耗。
  #   - 只作用于 mp4 直链；m3u8 分片层的 429 仍按限流退避重试，语义不变；
  #   - 只跳过该主机的节点，其余节点（含同域其它主机）照常尝试；
  #   - **不判整片死**，整片仍进下一轮重投（主机恢复了还能救回）；
  #   - 计数只存活于本次运行，不落盘。
  # 取 3 足以区分"偶发限流"（退避后恢复）与"整机故障"（次次复现）。
  mp4_host_circuit_threshold: 3
  # 画质预检样本大小（字节）：整片下载前先取头部这么多字节，用 ffprobe 读 moov
  # 判分辨率/编码/时长，码率 = Range 探测到的总长 × 8 / 时长。判定口径与下完整片
  # 后完全一致，却只花几 MB —— 避免 1~5GB 的整片下完才发现码率不达标而白丢。
  # moov 在文件尾部（非 faststart）时探测失败，此时放行走整片下载后再验，不误杀。
  # 只对 total_size > mp4_sample_size×2 的文件预检：更小的文件采样等于整片下两遍。
  mp4_sample_size: 8388608
  # 预检时长优先取上游 runtime_minutes（TMDB 元数据，可信的整片时长）。仅当它缺失
  # 才回退到样本探测，且样本时长低于此值（秒）时视为"疑似样本自身时长而非整片时长"
  # —— 用它当分母会让码率虚高几十倍、预检形同虚设，故判为不可信并放行整片下载。
  mp4_min_trusted_duration: 600
  # ==== 画质筛选（单一码率曲线，防误杀重设计 2026-09-03）====
  # 【整体流程】一部片的 master 里通常有多条清晰度流(variant)。对每条候选流采样测得
  #   (实测高度 h、视频编码 codec、采样码率 br)，依次过“合格判定”关；合格的
  #   流进入“择优”，最终选画质最好的一条下载。
  #
  # ⚠️ 判定由 resolution_check_enabled 分成两种模式。**码率任何时候都参与判定**，
  #    分辨率则可以整关摘除。默认（false）走下面的模式 B。
  #
  # ========== 模式 B：resolution_check_enabled: false（默认，只看码率） ==========
  #
  # 【唯一一关 · 绝对码率线】
  #     门槛 = bitrate_<codec> × leniency        ← 注意：**不乘 (h/1080)²**
  #     br ≥ 门槛 才合格。任何分辨率都卡同一条线（默认 2000×0.8 = 1600 kbps）。
  #
  #   ⚠️ 为什么必须不乘 (h/1080)² 缩放（这是本模式的关键）：
  #     那个因子本身就是分辨率在参与判定。若只关掉红线关却保留缩放，
  #     480p 的门槛会被缩到 2000×(480/1080)² ≈ 316 kbps —— 低分辨率片反而
  #     更容易过关，等于把分辨率以更隐蔽的方式又请了回来，与本模式的意图相反。
  #     不缩放后，低清片自然会因达不到绝对线而被淘汰（480p 很难有 1600 kbps）。
  #
  # 【择优】纯比采样码率。既然高度不再是画质标准，就不该由它决定“多条合格流选哪条”。
  #
  #   注：本模式下 min_resolution_height 完全不生效（红线关整关放行、
  #   master 候选也不再按声明高度预筛）；leniency 仍作用于码率门槛。
  #   另：候选流的“提前终止采样”优化在本模式下自动关闭（它的正确性依赖
  #   “择优按高度绝对优先”，纯比码率时按高度剪枝会误剪掉更优的流）。
  #
  # ========== 模式 A：resolution_check_enabled: true（旧口径，分辨率+码率） ==========
  #
  # 【第 1 关 · 分辨率红线】（带 leniency 容差）
  #     h ≥ min_resolution_height × leniency  才过关，否则淘汰。
  #     容差用于救回“准红线”片（如红线 1080 时的 1072/900），避免差几像素被一刀切。
  #
  # 【第 2 关 · 码率门槛】（单一曲线，按该流自身高度平方缩放）
  #     门槛 = bitrate_<codec> × (h / 1080)² × leniency
  #     br ≥ 门槛 才合格，否则淘汰（拦掉“伪高清”：分辨率够但压得糊、码率虚低）。
  #   - 门槛按“流自己的实测高度 h”缩放（码率需求 ∝ 像素数 ∝ 高度²，故用平方而非线性）。
  #     每条流按各自高度算门槛，不按红线算——调低红线时高分辨率流也不会集体免检进伪高清。
  #   - 无“高分辨率免码率”老规则：任何分辨率都要过自己那档码率门槛，逻辑统一。
  #
  # 【择优】实测高度更高的绝对优先；高度完全相同才比采样码率。
  #     不使用“分辨率×码率乘积”——会让低码率高分辨率的糊片胜出（如糊 4K 挤掉清晰 1080p）。
  #
  # ========== 两模式共通 ==========
  #   - codec 按视频编码分档（见下）；探测不到编码时回退 H.264 基准（最严），
  #     依赖多轮重采样再探，不误放伪高清。达标用 ≥（恰好达标即保留）。
  #
  # 【升档 / 降档怎么配】
  #   - 想整体调松/调严：只改 leniency 一处（两种模式都作用）。
  #   - 想单独调某编码的码率要求：改对应 bitrate_<codec>。
  #   - 想整体换红线（如下 720p / 上 1440p）：只改 min_resolution_height 一处，
  #     红线容差、码率门槛、择优全部自动随高度平方联动。（**仅模式 A 有效**）
  #   - 想新增编码档（如未来 VVC/H.266）：加一行 bitrate_<codec>，并在 download_movies.py
  #     的 BITRATE_BASELINE 与 normalize_codec 各加一处（仅此场景需改代码）。
  #
  # 分辨率是否参与画质判定。false（默认）=只按码率判断（模式 B）；
  # true=分辨率红线+码率门槛两关（模式 A，2026-09-09 之前的口径）。
  # 码率无论如何都参与判定，故没有对应的开关。
  resolution_check_enabled: false
  # 分辨率红线高度。⚠️ 仅在 resolution_check_enabled: true 时生效，默认配置下不起作用。
  min_resolution_height: 1080
  # ⚠️ leniency 是“乘在门槛/达标线上的系数”，判定为“码率 ≥ 门槛、高度 ≥ 达标线”，故：
  #   越大 → 门槛越高 → 越严格（更防伪高清）；越小 → 门槛越低 → 越宽松（更防误杀合格片）。
  #   例：H.264 1080p 基准 2000，leniency=0.8→门槛 1600、0.9→1800（更严）、0.7→1400（更松）。
  #   名字叫 leniency（宽容度）但“越大越宽容”的字面直觉是反的，实为“门槛系数”，越大越严。
  leniency: 0.8
  # 各视频编码在“1080p 基准”下的最低码率门槛（kbps）。模式 A 下按 (h/1080)² 随流高度
  # 缩放；模式 B 下不缩放，直接就是绝对线。
  # 同一主观画质下高效编码更省码率，故各设等效基准，避免用 H.264 门槛误杀高效编码的清晰片。
  # ffprobe 实测的 codec_name 会被归一到下面的键：
  #   h264/avc → h264 ；hevc/h265 → hevc ；av1/av01 → av1 ；vp9 → vp9 。
  # 未列出的编码 / 探测失败 → 回退 H.264 基准（bitrate_h264，最严）。
  # 说明：会被 H.264 门槛误杀的只有“比 H.264 更高效”的编码(HEVC/AV1/VP9，已覆盖)；
  #   更老/更低效的编码(MPEG-2/4、VC-1、VP8 等)用 H.264 门槛偏松，属“放行”非“误杀”，无需加档。
  # ⚠️ 四档是**等效关系**，调整时应同比例改动，否则会破坏“同主观画质”的对齐：
  #   单独抬高 h264 会让 HEVC/AV1 片相对更容易过关；单独抬高 hevc 则会误杀高效编码的清晰片。
  bitrate_h264: 2000   # H.264/AVC 基准（= 2 Mbps 红线）
  bitrate_hevc: 1189   # HEVC/H.265（省约 40%）
  bitrate_av1:  1000   # AV1（省约 50%）
  bitrate_vp9:  1514   # VP9（效率介于 H.264 与 HEVC 之间）
  # 【整片画质判死阈值】本轮尝试过的节点中，因画质不达标被确定性淘汰的比例达到
  # 该值、且无一节点下载成功时，整片直接判死，不再进入下一轮重投。
  #
  # 为什么可以用"概率"代替"逐轮求证"：分辨率声明与码率是**源站侧的固有属性**，
  # 不是随机变量——同一条 url 下一轮拿到的还是 480p。既然过半节点都不达标，就有
  # 充分理由推断其余节点大概率同样不达标。
  # 实测依据（AGENTS.md §12.11 D，200 部首跑）：29 部失败片各白跑满 3 轮，
  # 轮 2+轮 3 合计约 28 分钟（占总时长 37%）却只救回 1 部，其中约 17 部是画质
  # 注定不达标。全量几十万部时这份浪费会被线性放大。
  #
  # ⚠️ 只统计"画质"这一类确定性淘汰，源站 5xx / 采样抖动等瞬时失败**不计入**，
  # 故源站抽风不会触发误杀（唯一被三轮救回的那部片正是全节点瞬时失败）。
  #
  # 取值语义：
  #   0.5  过半即判死（默认，用户拍板）
  #   1.0  最保守——全部节点都因画质淘汰才判死
  #   >1.0 等于永不判死，回到本功能上线前的乐观口径
  quality_kill_ratio: 0.5
  # 缺片保护：分片下载完成后，若缺片率超过阈值则判失败（写 failed 可重下），
  # 不再"丢一堆片也判成功后永久跳过"。分片通常 2~6 秒，2% 对两小时影片约
  # 累计丢失 1 分钟以内、分散在全片，属"偶尔跳一下"，不影响主体观看。
  max_missing_ratio: 0.02
  # 小样本豁免：总片数很少时 2% 可能连 1 片都不到，会被苛刻卡死。
  # 允许至少丢这么多片而不触发阈值判定（取比例值与本值中较大者）。
  min_missing_allowance: 1
  # 上传失败待补传清单：记录"已下载但上传 R2 失败、仍留在本地"的文件，
  # 供 `python download_movies.py reupload` 手动补传时精确定位。
  upload_pending_log: "upload_pending.jsonl"
  # ---- S3 兼容对象存储（Cloudflare R2）上传配置 ----
  # 每部影片转封装成功后并发上传到 R2，上传成功即删除本地文件；
  # 上传失败则保留本地文件并写入 upload_pending_log 等待手动补传。
  s3:
    enabled: true            # true=上传成功后按 delete_local_after_upload 决定是否删本地；false=走老逻辑（不传不删）
    # 敏感字段（endpoint_url/bucket/access_key/secret_key）优先从环境变量 / 同目录 .env 读取，
    # 环境变量缺省时才回退这里的值。生产环境请留空，改用 .env（见 .env.example）。
    endpoint_url: ""         # 环境变量 R2_ENDPOINT_URL；如 https://<account_id>.r2.cloudflarestorage.com
    region: "auto"           # R2 固定用 auto
    bucket: ""               # 环境变量 R2_BUCKET；目标存储桶名
    prefix: ""               # 桶内根前缀（留空）：对象键直接从「folder_prefix/发布年份/tmdbId/」开始
    access_key: ""           # 环境变量 R2_ACCESS_KEY
    secret_key: ""           # 环境变量 R2_SECRET_KEY
    upload_workers: 16       # 上传并发数
    max_pending_uploads: 64  # 反压阈值：在途+排队上传数达到此值就阻塞下载，防磁盘撑爆
    upload_retry_max: 5      # 单文件上传最大重试次数
    upload_retry_delay: 3    # 上传重试基础间隔（秒，指数退避）
    connect_timeout: 15      # boto3 连接超时（秒）：默认 60s 太长，R2 抖动时会顶满反压
    read_timeout: 120        # boto3 读取超时（秒）
    # 等待上传槽位的上限（秒）。信号量 acquire 由主事件循环线程执行，绝不能无限期等：
    # R2 长时间消化不动时，下载完成的 future 无人处理、转封装不再提交、已下好的
    # 成品在 temp 里持续堆积（它们已交接给转封装阶段，不会被任何 finally 清理），
    # 整条流水线连同磁盘一起被远端故障拖垮。超时即降级为「留本地 + 写 pending」，
    # 主循环继续推进下载与转封装，事后用 reupload 子命令补传。
    upload_slot_wait_timeout: 300
    delete_local_after_upload: true   # 上传成功后删除本地 mp4（全量必开，否则磁盘累积撑爆）
  # ---- 磁盘水位监控（兜底）----
  # 反压按"上传数量"封顶，兜不住大文件/上传持续失败堆积/enabled=false 等场景。
  # 水位监控按 base_dir 所在磁盘的实际占用百分比做终极熔断：
  #   占用超过 high_watermark 就闸住"未开始的新片下载"（不打断在跑的下载/转封装/上传），
  #   等上传腾出空间、占用回落到 low_watermark 以下再放开。
  disk_guard:
    enabled: true            # 默认开启兜底
    high_watermark: 0.85     # 磁盘占用达到 85% 闸住新下载
    low_watermark: 0.75      # 回落到 75% 以下恢复新下载
    check_interval: 5        # 监控线程检查间隔（秒）


# ----------------------------------------------------------------------------
# fetch_subtitles.py —— 用 SubDL 为下载侧没取到字幕的影片补漏
#
# ⚠️ 本段**只有 subdl_api_key 一个可调项，且它应该留空**（见下）。
#    其余参数刻意不放在这里 —— 字幕的语种、格式、落盘路径必须与下载侧
#    **完全一致**，否则补来的字幕会落到视频找不到的地方、或格式对不上。
#    故 fetch_subtitles.py 直接复用 download_movies 段，单一事实来源：
#
#      语种白名单  <- download_movies.assets.subtitle_languages
#      输出格式    <- download_movies.assets.subtitle_formats
#      大小上限    <- download_movies.assets.subtitle_max_bytes
#      成功日志    <- download_movies.success_log
#      目录/对象键 <- download_movies.base_dir + folder_prefix
#      是否传 R2   <- download_movies.s3.enabled
#
#    **要改字幕语种/格式，请改 download_movies.assets 段，不是这里。**
#
# 断点续跑的状态日志固定为脚本同目录的 subtitles.jsonl（纯观测用，
# 真正的"哪些语种已有"以 R2 上的实际对象为准，删掉它也不影响正确性）。
#
# 另有 subtitles_gaps.jsonl 是**缺口台账**：记录"SubDL 确认没有某片某语种"，
# 下次运行直接跳过该语种以省配额（实测 zh 缺口占一半以上，重查纯属浪费）。
# 只记"源站确认没有"，取回失败的不记（那些下次还要再试）。
# 删掉它同样不影响正确性，代价只是下次会把这些语种再问一遍。
# ----------------------------------------------------------------------------
fetch_subtitles:
  # SubDL API Key：敏感项，**请留空**，改配到同目录 .env 的 SUBDL_API_KEY。
  # config.yaml 会进版本库，填在这里等于把 key 公开推到远端仓库；
  # .env 已被 .gitignore 排除，是唯一安全的落点（见 .env.example）。
  # 免费申请：https://subdl.com/panel/api
  subdl_api_key: ""
