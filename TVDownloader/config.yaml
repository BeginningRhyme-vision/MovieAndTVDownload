# ============================================================================
# TVDownloader 项目统一配置文件
# ----------------------------------------------------------------------------
# 【设计约定】
#   - 本文件按“代码文件”分段：每个顶层键对应一个 .py 脚本，段名与脚本文件名
#     （去掉 .py）一致。
#   - 每个脚本运行时只读取自己对应的那一段，互不干扰。
#   - 想改某个脚本的参数，只需改它所属段落，无需改动任何代码。
#   - 例外：pipeline.py（取流↔下载同进程重叠）不单独成段，它读 download_tv
#     段下的 pipeline 子段，并原样透传命令行参数给 tv_ids_to_links。
#
# 【与 MovieDownloader 的差异】
#   - 元数据/取流/下载的处理单位从“一部电影”变为“一集”：tmdb_id + season + episode。
#   - 季集结构以 TMDB 为准（取流阶段调 /tv/{id} 展开），IMDB episode 表仅作参考与筛选。
#   - R2 对象键：tv/{首播年}/{剧tmdbId}/S{季:02d}/E{集:02d}/E{集:02d}.mp4
#     （本地目录同构，meta.json 与 subs/ 字幕同前缀）
# ============================================================================


# ----------------------------------------------------------------------------
# fetch_tv_metadata.py —— 抓取 IMDB 全量电视剧元数据并转换 TMDB ID
# ----------------------------------------------------------------------------
fetch_tv_metadata:
  # TMDB API Key：敏感项，请配置到同目录 .env 的 TMDB_API_KEY（见 .env.example）。
  # 环境变量优先；此处留空，仅作本地调试回退。生产环境务必留空。
  tmdb_api_key: ""

  # 只保留哪些 IMDB 条目类型（title.basics 的 titleType 列）。
  # 【注意】titleType 是精确枚举字符串，代码用 isin() 精确匹配，不存在 "tv" 这种
  #   父类/通配值，写 "tv" 会匹配 0 行；必须逐个列出完整的值。
  # IMDB 官方文档只举例不枚举；据公开数据统计，titleType 实际共 11 种：
  #   非 TV（4 种）：movie / short / video / videoGame
  #   TV 前缀（7 种）：tvSeries / tvMiniSeries / tvSpecial / tvShort
  #                    / tvEpisode / tvMovie / tvPilot
  # 本段只收前 4 种，另外 3 种 TV 类型有意排除，理由：
  #   - tvEpisode：分集本身，占 title.basics 总行数 80%+；分集信息由 title.episode
  #                表展开（见 query_episodes），若收进来每部剧会重复出现几百条。
  #   - tvMovie  ：电视电影，单文件、无季集结构；TMDB Find 接口把它归到
  #                movie_results 而非 tv_results，且下游 S01/E01 下载路径不适用。
  #                应由电影版 pipeline 处理。若收进本列表，会被写入 as_movie_output
  #                旁路文件而非 output（见下方说明）。
  #   - tvPilot  ：未成剧的试播集，数量极少且大多无资源，忽略。
  # 注意：tvSpecial / tvShort 在 TMDB 里也常被建模为 movie，同样走旁路文件；
  # 保留在列表里是因为仍有相当一部分特辑在 TMDB 里挂在剧集的 Specials 季下。
  # 首次跑完后可用下面命令实际核对本地数据集中的取值分布：
  #   gzip -dc imdb_data/title.basics.tsv.gz | cut -f2 | sort | uniq -c
  keep_types:
    - tvSeries
    - tvMiniSeries
    - tvSpecial
    - tvShort

  # 调用 TMDB API 的并发线程数。TMDB 软上限约 50 req/s，配合 sleep 控制整体 QPS
  max_workers: 16

  # 每次调用 TMDB API 后的固定间隔（秒），用于降低触发限速的概率
  # 粗略估算：QPS ≈ max_workers / (请求耗时 + sleep)，按请求 ~0.2s 计，16 并发 + 0.1s 约 50 QPS，
  # 正好贴着 TMDB 软上限；若日志出现 429 可调大到 0.2（约 40 QPS）
  sleep: 0.1

  # ---- 以下为文件路径，一般无需修改 ----
  # IMDB 数据集与 SQLite 索引库所在目录（TVDownloader 独立一份，不与电影共用）
  data_dir: "imdb_data"
  # 最终输出的电视剧元数据文件（下游 filter_to_ids.py 的输入）
  output: "tv_series.jsonl"
  # 旁路输出：IMDB 标为 TV 类型但 TMDB 只在 movie_results 里有记录的条目
  # （多为 tvSpecial / tvShort）。TV pipeline 无法处理，留档给电影版 pipeline 接手。
  # 无表头 TSV，三列：imdb_id \t tmdb_movie_id \t imdb_titleType
  as_movie_output: "tv_as_movie.tsv"
  # 断点续跑的进度记录文件（记录已处理的 imdb_id）
  progress: "progress.txt"
  # 运行日志文件
  log_path: "fetch.log"


# ----------------------------------------------------------------------------
# filter_to_ids.py —— 按 filter_config.yaml 从 tv_series.jsonl 中筛出要下载的剧
# ----------------------------------------------------------------------------
filter_to_ids:
  # 输入：fetch_tv_metadata.py 的产物（应与上面 fetch_tv_metadata.output 一致）
  input: "tv_series.jsonl"
  # 筛选规则文件（各筛选项的开关与阈值都在这里，本段只管路径）
  filter_config: "filter_config.yaml"
  # 输出：通过筛选的剧 tmdb_id 列表，一行一个（应与下面 tv_ids_to_links.input 一致）
  output_ids: "ids.txt"
  # 输出：通过筛选的剧明细（不含 episodes 列表），仅供人工复核
  output_detail: "filtered.jsonl"


# ----------------------------------------------------------------------------
# tv_ids_to_links.py —— 由 tmdb_id 展开季集结构，并逐集解析出可播放的 m3u8 地址
# ----------------------------------------------------------------------------
tv_ids_to_links:
  # 输入：待解析的剧集 tmdb_id 列表（filter_to_ids.py 的产物，一行一个剧 ID）
  input: "ids.txt"
  # 剧集静态元数据源（fetch_tv_metadata.py 的产物）。取流成功时按 tmdb_id 查表，
  # 把 year/original_title/genres/title_type/imdb_id 合并进 output，
  # 供下游 download_tv 拼 R2 路径 {year}/... 及后续用途。缺失则各字段留空。
  metadata: "tv_series.jsonl"
  # 输出：解析成功的结果，一行一集（含 season/episode 与 m3u8 地址）
  output: "results.jsonl"
  # 解析失败记录：集级 tmdb_id\tseason\tepisode（真无源）；剧级 tmdb_id\t-\t-（TMDB 404）；
  # 多轮重试耗尽 tmdb_id\tseason\tepisode\tretry-exhausted（下次运行自动重试）
  fail_file: "fail.txt"
  # 季集结构缓存：TMDB /tv/{id} 展开结果，避免多轮/续跑时重复调 API
  # 每行 {tmdbId, name, year, ended, seasons:[{season, episodes, air_dates}]}；
  # air_dates 用于跳过未播集（air_date + air_grace_days 在今天之后，或未完结剧的 TBA 集），下次运行自动再试
  seasons_cache: "seasons_cache.jsonl"
  # 上架宽限期（天）：刚播出的集源站通常滞后几天才上架，此窗口内不发请求、不判死，
  # 下次运行自动纳入。设 0 则播出当天即尝试。
  air_grace_days: 5

  # TMDB API Key：用于调 /tv/{id} 拿季集结构。敏感项，走 .env 的 TMDB_API_KEY，
  # 环境变量优先；此处留空，仅作本地调试回退。
  tmdb_api_key: ""
  # 是否包含 season 0（TMDB 里的 Specials/特辑）
  include_specials: true
  # TMDB 展开阶段的并发数 / 每次请求后的间隔（秒）/ 超时 / 重试次数
  # 每部剧约 1 + ceil(季数/20) 次请求，8 并发 + 0.1s 远低于 TMDB 限速
  tmdb_workers: 8
  tmdb_sleep: 0.1
  tmdb_timeout: 15
  tmdb_retries: 3
  # TMDB 429 限流时按 Retry-After 等待的单次上限（秒），防止离谱值挂住线程
  tmdb_retry_after_max: 30
  # 缓存刷新：默认只展开未缓存的剧。在播剧后续新播出的集不会自动进缓存，
  # 需要时运行 `python tv_ids_to_links.py --refresh-ongoing`，重新展开 ended 非 true 的剧
  # （含旧格式缺 ended 字段的缓存行），以追加行覆盖旧缓存。

  # 解密服务 API 根地址（负责 enc-vidup / dec-vidup / enc-vidfast / dec-vidfast / enc-vidlink 加解密）
  api: "https://enc-dec.app/api"
  # 取流源顺序：同一次尝试内按此顺序逐家取流，首家命中即返回，不再打后面的源。
  # 某家真无源或瞬时错误都继续试下一家；全部跑完仍无 url 时，只要有任一家是瞬时错误就重试，
  # 全部真无源才算一次“疑似无源”（再走 dead_confirm 换 IP 复探）。可用：vidup / vidlink / vidfast。
  # vidup、vidfast 出 m3u8；vidlink 出带时效签名的 mp4 直链（带 quality/size，下载头 okhttp）。
  # 命令行 --providers vidlink,vidfast 可临时覆盖（如 --recheck-dead 只用新源复扫）。
  providers: [vidup, vidlink, vidfast]
  # 并发线程数：同时解析多少集。配合住宅代理分散 IP。
  # 无源404不重试，任务为纯IO等待，可拉高并发；电影版 50 实测稳定。
  # 2026-09 全量实跑：50 并发时老剧段（判死需 2 轮 × 5 server）仅 ~72 集/分钟，瓶颈在代理 RTT，
  # RSS/CPU 均无压力，提到 100 提升吞吐。
  max_workers: 100
  # 单集的最大重试次数与每次重试间隔（秒）
  # 白名单判死：只有页面 404 或全部 server 的 stream 接口 404 才算真无源(dead)；
  # 其余任何错误(SSL/超时/5xx/解密服务异常/结构异常)一律视为瞬时，重试后进入多轮捞回
  max_retries: 3
  retry_delay: 1
  # 判死二次确认：首次 404 只算“疑似无源”，换出口 IP 再完整探一次，连续两次 404 才写 fail.txt，
  # 防 CDN/代理抖动把有源集永久误判丢失；命中过 404 的集重试预算 +1。false 则单次 404 即判死。
  dead_confirm: true
  # 批量误杀熔断：连续 N 集判死且中间无一成功时，先复探 3 个历史成功集（金丝雀，优先本轮刚成功的）：
  # 有任一成功 → 上游正常、这段只是真无源，继续跑；无一成功且至少一个明确 404 → 判定 vidup/enc-dec
  # 系统性变更，回滚本窗口写入 fail_file 的 N 行并以退出码 2 终止，防止上游一坏就把整批集“正确地”永久判死。
  # 尚无任何成功集可作金丝雀、或金丝雀全是瞬时错误（限流/超时）→ 无法判断，放行继续。
  # 取值依据：实测新剧段有源率 ~14%，按剧连败最长 ~135 集；老剧段有源率接近 0 但金丝雀会放行，
  # 故 N 只影响“上游真坏时多快停下”，500 集 ≈ 100 并发下 2–3 分钟。0 关闭。--recheck-dead 模式不启用。
  dead_streak_breaker: 500
  # 死集复查：源站后补上架或历史误判的集，可运行 `python tv_ids_to_links.py --recheck-dead`
  # 只重探 fail_file 中集级真无源且至今未成功的集；成功追加 output，仍无源不重复写 fail_file。
  # ---- 多轮捞回：整批跑完后对“瞬时耗尽”的集自动重跑，直到清零或达上限 ----
  #   - 单集在 process_episode 内换 IP 重试 max_retries 次仍失败(瞬时耗尽) → 下一轮重跑；
  #   - 真无源404 → 永久排除，绝不再抓（注意：是“这一集”无源，不影响同剧其它集）；
  #   - output 直接就是全部轮次成功结果的合并。
  max_rounds: 8
  # 轮间退避：第 n 轮结束后等待 min(round_backoff*n, round_backoff_max) 秒再进入下一轮，
  # 给代理池换 IP / 源站恢复留时间。若某轮 ≥90% 且 ≥50 集都是瞬时失败（疑似代理或源站整体故障），
  # 直接等待 round_backoff_max。达 max_rounds 仍失败的集写入 fail_file 并标记
  # "retry-exhausted"（第 4 列），下次运行不视为已处理、自动重试。
  round_backoff: 30
  round_backoff_max: 300
  # 单个 HTTP 请求超时（秒）
  timeout: 12
  # 代理配置：vidup.to 有 Cloudflare 机房 IP 拦截，直连会 403，需走住宅代理。
  # 敏感项 user/password 请配置到同目录 .env 的 PROXY_USER / PROXY_PASSWORD（见 .env.example）。
  # 环境变量优先；此处 user/password 留空，仅作本地调试回退。生产环境务必留空。
  proxy:
    # true=启用下方代理，false=直连
    enabled: true
    # 当前代理：dataedpt（2026-09-14 与电影侧对齐切换）。单端口，由网关自身在
    # 每次请求时轮换出口 IP（电影侧已实测：连续请求得到的出口 IP 分属不同国家），
    # 因此 port_range 取单点即可。
    # ⚠️ 账号密码在 .env（PROXY_USER=furion2025-zone-adam）。用户名里的
    #    -zone-adam 是厂商的通道参数，必须整串原样传，不要以为是后缀去掉。
    host: "4x3h6x5m-as.dataedpt.com"
    user: ""
    password: ""
    # 端口范围 [起, 止]，每次请求随机取一个端口以更换出口 IP
    port_range: [2345, 2345]
    # --- 旧代理 proxyrack（保留备查，需回滚时把上面两项换成下面两行，
    #     并把 .env 的 PROXY_USER / PROXY_PASSWORD 一起换回 proxyrack 那组）---
    # host: "unmetered.residential.proxyrack.net"
    # port_range: [9000, 9050]
    # 与 dataedpt 的差异：proxyrack 靠「随机端口」换出口 IP，故需 9000-9050 的范围；
    # dataedpt 由网关自动轮换，单端口即可。两者同为 HTTP 协议，build_proxy() 无需改动。


# ----------------------------------------------------------------------------
# download_tv.py —— 下载 m3u8 并转封装为 mp4（按集）
# ----------------------------------------------------------------------------
download_tv:
  # 输入与日志
  # 全量下载直接消费取流产物 results.jsonl（一行一集，自带 year/season/episode 等）
  input: "results.jsonl"
  success_log: "success.jsonl"
  failed_log: "failed.jsonl"
  # ---- 多轮下载：对因瞬时错误(5xx/超时/SSL/缺片等)下载失败且可重试的集自动重跑 ----
  # 确定性失败（404/无源、画质不达标、缺 tmdbId/season/episode/url）绝不进入下一轮。
  multi_round:
    enabled: true           # false=只跑一轮
    # 【最大下载轮次（含第一轮）】
    #
    # 🔴 2026-09-14 由 3 改为 1，与电影侧对齐（电影侧 200 部实跑实证）：
    #   轮 1 结束 61 部成品 → 轮 2（27 部）救回 0 → 轮 3（27 部）救回 0。
    #   **54 部次重投，一部没救回来**，却占掉约 33% 的运行时间。
    #
    # 根因不是"重试次数不够"，而是**重试的时间尺度完全不匹配**：
    # 那些失败全部指向 CDN 回源故障，而这类故障恢复是**小时级**，
    # cooldown_seconds=60 让三轮跨度不到 5 分钟 —— 无论重投几次都跨不过窗口。
    #
    # 🎯 同一批片的三个重试层级实测对比：
    #   | 重试层级            | 间隔       | 救回 |
    #   | 单轮内 playlist ×9  | 秒~分钟    |  0  |
    #   | 同运行多轮（轮2/3） | 60 秒      |  0  |
    #   | **跨运行重试**      | **2 小时** | **3** |
    #   ⇒ 只有跨运行那一层真正有效。
    #
    # 🔑 TV 侧比电影侧更适合改 1：全量几百万集跑完一轮是**天级**，
    #    天然就是"过很久再试"，恰好落在源站真正恢复的窗口里。
    #    而跨运行重试机制 TV 侧本就完整（§0.11 四层齐全，失败集下次运行
    #    自动重投——_run_pipeline 只按 success 与判死账本跳过）。
    #
    # 什么时候该调回 >1：确认失败主因变成"秒级抽风、重投立刻就好"的那种
    # 瞬时错误时（届时应能看到轮 2 救回率显著 >0）。接线全部保留，改数即可。
    max_rounds: 1
    # 轮次之间的冷却等待（秒）。只为源站的**短时**抖动留恢复窗口。
    # 原设 300s 是按"等风控解除"定的，电影侧 200 部实跑证伪了这个前提：
    # 403/429 零触发，502 才是主因，而 502 是源站容量问题、冷却再久也不解决，
    # 300s 三轮共 10 分钟纯空转白占总时长 13%。TV 侧同步降到 60s 对齐。
    # 真遇到风控（403/429 大量出现）时再调回。
    #
    # ⚠️ max_rounds=1 时本项**不生效**（没有"轮次之间"）。保留取值是为了
    # 日后调回多轮时不必重新推导。
    cooldown_seconds: 60
    # ⚠️ TV 侧**没有**"源站回源故障长冷却分档"（电影侧的 source_outage_cooldown_seconds）。
    # 那套机制在电影侧已实测推翻并默认关闭（1800s 既跨不过小时级的故障窗口、
    # 又比短档多烧 29 分钟），TV 侧从未移植，也不打算移植——这类失败交由
    # 跨运行重试兜底：failed 的集下次运行本就会自动重投（本脚本只按 success 跳过），
    # 那时往往已过数小时，恰好落在源站真正恢复的窗口里。
  # ---- 陈旧直链启动预检（跨运行重试的关键一环）----
  # results.jsonl 里的集躺过 stale_after_seconds 后，启动时先重新取流换新 url
  # 再下载，而不是等下载失败了才发现链接已过期。
  #
  # 为什么 TV 侧特别需要它：vidlink 出的是带 sign&t 时效签名的 mp4 直链，而
  # 取流侧的 load_processed 把 results.jsonl 里已成功的集算作"已处理"——重跑
  # 取流**不会**给这些集换链接。没有本预检时闭环是死的：
  #   取流不换链接 → 下载拿旧 url → 判"需重新取流" → 什么也没发生 → 下次重复
  # 全量取流要跑很多天，第 1 天取到的直链到第 10 天大概率已经过期。
  #
  # ⚠️ 重取无果的集**原样保留**，绝不丢弃：阈值只是经验值，旧链接未必真失效；
  # 且只配了 R2 凭证、没配代理凭证的机器根本取不了流，丢弃等于整批全军覆没。
  # 本功能是优化，绝不允许它反过来降低下载成功率。
  auto_refetch:
    enabled: true
    # 超过这么久（秒）视为陈旧。0 = 关闭预检（退回旧行为）。
    # 86400 = 24 小时。vidlink 实测有效期至少天级，故不必设得太激进。
    stale_after_seconds: 86400
    # 重取并发。取流走代理、与下载争带宽，故远小于取流侧独立运行时的 max_workers。
    workers: 8
    # 单集在一次运行中最多被重取几次，防"取流-过期-重取"反复空转。
    max_per_episode: 2
    # 【TV 侧特有】单次启动预检最多处理多少集。
    #
    # 为什么必须有：TV 侧取流成功约 15-20 万集，跨运行间隔超过 24h 后 stale
    # 会是几万到十几万集。而单集取流要打多个 provider × 多 server × 12s 超时，
    # 8 并发下 600s 最多只够几百集 —— 一次性全投会让绝大多数集排队到超时被丢弃，
    # 且它们的 refetch_counts 不会 +1，下次运行又从头再来，队尾的集永远轮不到。
    # 故按 fetched_at 升序（最旧的最可能过期）截断，其余留给下次运行。
    # 0 = 不限额（仅适合小批量，TV 全量下不要这么设）。
    # pipeline 模式下预检重取与主取流共享同一个代理池，每条最多 MAX_RETRIES+1
    # 次尝试、每次换 IP；设太大启动初期会叠加出数倍于稳态的配额消耗。
    max_per_run: 500
    # 单次预检的总耗时上限（秒）。**仅非流式**（单独跑 download_tv.py）时生效：
    # 那条路径由主线程同步调用，此刻下载还没开始，但不能让它无限期堵住启动。
    # 超时即收下已完成的部分、放弃仍在跑的（放弃的那批会挂回调把结果落盘，
    # 供下次运行使用，不白跑）。pipeline 模式走异步投递，本项无效。
    round_timeout_seconds: 600
    # 【仅 pipeline.py】轮末投出异步重取后，等待在途结果回来的上限（秒）。
    # 投完必须等一等再判"还有没有集要重投"——否则会认为没有、直接收尾，
    # 重取成功的新链接就没有任何轮次去消费它。期间每秒收一次，在途清零即
    # 提前结束，不会白等满；Ctrl+C 可立即打断。
    #
    # 📌 max_rounds=1（当前默认）时这条路基本走不到：过期直链在
    # handle_done_future 里**发现即投递**，由首轮来源随到随投消费。
    # 本项主要服务于日后把 max_rounds 调回 >1 的情形。
    async_wait_seconds: 120
    # 预检是否跳过"上次因画质不达标被判死"的集。
    #
    # TV 侧集级有源率只有个位数百分比，大量集取流成功但画质不达标（分辨率低于
    # 红线 / 码率未达门槛）。这类失败**重取一次流也还是不达标**，却同样会因为
    # 躺够 stale_after_seconds 而被送去重取，白烧住宅代理配额。
    # 关掉则退回"只看时间不看历史"的旧行为。
    skip_quality_dead: true
  # 两个独立于 success.jsonl/failed.jsonl 的下载态状态文件，全程可查当前下载进度：
  #   download_ok_log   —— 累计追加，每集“下载”成功一条（不含转封装/上传）
  #   download_fail_log —— 每轮开头清空重写，只记本轮“下载”失败的集
  download_ok_log: "download_ok.jsonl"
  download_fail_log: "download_fail.jsonl"
  # 【画质判死账本】累计追加，记"因画质被确定性判死"的集 + 当时的判定依据。
  # 启动时并入跳过集，避免每次重跑都把注定失败的集重新采样、重新判死一遍。
  #
  # 🔑 TV 侧比电影侧更需要它：集级有源率只有个位数，而"取到流了但画质不达标"
  # 在失败构成里占比很高。此前这类集每次运行都会被完整投入下载队列、重新采样
  # 求证同一个结论（`load_quality_dead_keys` 只用于跳过重取流，不影响是否下载），
  # 几十万集规模下浪费被线性放大。
  #
  # ⚠️ 与 fail.txt 语义完全不同，勿混用：
  #   fail.txt          = 取流侧"源站明确说没有这一集"，永久排除；
  #   download_dead_log = "有源但画质不达标"，门槛调松后可用 --retry-dead 放回。
  #
  # 想让全部判死集重新参与下载：删掉此文件，或用 --retry-dead 按新门槛自动筛。
  download_dead_log: "download_dead.jsonl"
  # --retry-dead 放回判死集的余量系数：要求 新门槛 × 本值 <= 当时实测码率。
  # 为什么要留余量：实测码率是"那次采样窗口"的值、本身有波动。门槛恰好压在
  # 记录值上就放回的话，重新采样很可能测出略低的值又被判死，形成来回震荡、
  # 每轮都白跑。1.05 = 门槛要比记录值低 5% 以上才放回。设 1.0 = 不留余量。
  dead_revive_margin: 1.05
  # ---- 收尾自动补传 ----
  # 上传槽位等待超时（s3.upload_slot_wait_timeout，默认 300s）会把该集降级为
  # 「不上传、成品留本地 + 写 upload_pending.jsonl」。这些集**下载是成功的**，
  # 既不进失败队列也不进重试桶，**不会被任何后续轮次处理** —— 改前唯一的出路
  # 就是人工跑一次 `python download_tv.py reupload`。
  #
  # 而降级只需 R2 积压 300 秒就会触发，主流程却还要再跑几小时（TV 全量更是
  # 跑几天），跑完时 R2 往往早已恢复。此时自动补一次能省掉这次人工介入。
  #
  # ⚠️ 主流程异常退出 / 被 Ctrl+C 时**不会**自动补传（状态未知，且用户正想让它
  # 停下），那种情况仍需手动 reupload。手动入口始终保留。
  auto_reupload:
    enabled: true
  # ---- failed.jsonl 归档轮转 ----
  # failed.jsonl 是纯追加、永不清理的。TV 侧几十万集规模下它会持续膨胀，而
  # `load_quality_dead_keys()` **每次启动都要全量顺扫它**，启动成本线性上升。
  #
  # 超过 max_bytes 就在**运行收尾时**轮转：整个文件移进 archive/failed_<时间戳>.jsonl，
  # 再把仍有用的行原样写回一个新的 failed.jsonl。
  #
  # 🔑 为什么要回填而不是简单移走：两类行还有人要读 ——
  #   ① 带"需重新取流"标记的行 —— 重取闭环靠它挑待重取的集，丢了重试链当场
  #      断裂，直接牺牲下载成功率；
  #   ② 画质判死行 —— `load_quality_dead_keys` 靠它决定预检跳过哪些集，丢了
  #      那些集会重新进入重取队列、白烧住宅代理配额。
  # 回填后新文件只剩这两类（极少），历史则一条不丢地留在 archive/ 里。
  #
  # 被中断/异常退出时不轮转（状态未知，维护动作让位于尽快退出）。
  # max_bytes: 0 关闭轮转。archive/ 目录可自行清理，不影响任何业务逻辑。
  failed_log_rotation:
    max_bytes: 104857600    # 100MB
  # 视频落盘根目录与临时工作目录。
  #   1) 相对路径（如 downloads）—— 以脚本所在目录 TVDownloader/ 为根；
  #   2) 绝对路径（如 /mnt/data/downloads）—— 直接使用该路径；
  #   3) 两者建议放在同一磁盘，成品从 temp_dir 移到 base_dir 才是瞬时操作。
  base_dir: "downloads"
  temp_dir: "temp"
  # 本地目录与 R2 对象键共用的根段，两侧严格同构：
  #   本地  {base_dir}/tv/{首播年}/{剧tmdbId}/S{季:02d}/E{集:02d}/E{集:02d}.mp4
  #   R2    {s3.prefix}/tv/{首播年}/{剧tmdbId}/S{季:02d}/E{集:02d}/E{集:02d}.mp4
  # 每集独占一个目录，meta.json 与 subs/ 字幕作为旁车资产落在同一目录下，
  # 前端按同前缀一次列举即可拿全；fetch_subtitles.py 也能由 (tid,季,集,年)
  # 纯计算出前缀，不依赖任何日志记录即可判重与补传。
  folder_prefix: "tv"
  # ---- 旁车资产（meta.json + 字幕）----
  # 尽力而为：写入/上传失败只打印告警，绝不影响整集的下载与上传结果。
  assets:
    # 是否为每集生成 meta.json（含剧集元数据 + 本次实测的分辨率/码率）。
    # 其中 subtitles[] 先由下载侧写入内嵌字幕，再由 fetch_subtitles.py
    # 补抓 SubDL 字幕后就地更新。
    meta_enabled: true
    # 是否抓取取流侧带回的内嵌字幕（results.jsonl 的 captions 字段）。
    # 这批字幕是零配额白捡的：取流响应里本就带着（vidup 的 tracks[]、
    # vidlink 的 captions[]），顺手下下来即可，不消耗 SubDL 的每日额度。
    # 抓不到不算下载失败——尽力而为，剩下的交给 fetch_subtitles.py 补。
    subtitles_enabled: true
    # 字幕语种白名单（小写语言代码）与输出格式。
    # ⚠️ 本段是字幕的**单一事实来源**：download_tv.py 的内嵌字幕与
    # fetch_subtitles.py 的 SubDL 补抓都直接复用这几项，
    # 要改语种/格式请改这里，不要改 fetch_subtitles 段。
    subtitle_languages: ["en", "zh"]
    # 同时保留 VTT 与 SRT：浏览器原生 <track> 只吃 WebVTT，而多数本地播放器
    # 以 SRT 为主。字幕体积极小（几十 KB），两份都存的代价可忽略。
    subtitle_formats: ["vtt", "srt"]
    # 单个字幕文件的下载超时（秒）与大小上限（字节）。
    # 上限是防御性的：字幕正常只有几十 KB，若源站把一个视频/错误页塞过来，
    # 不设限会把它整个读进内存。
    subtitle_timeout: 30
    subtitle_max_bytes: 5242880
  # 并发控制
  #
  # 🔴 2026-09-14 由 32 降到 16，与电影侧对齐（电影侧依据见其 config.yaml 同名项）。
  #
  # 🔑 核心认识：**总吞吐由带宽定死，与并发数无关**。服务器实测链路上限
  #    111MB/s（≈890Mbps，跨 5 源 10 连接聚合测得）。这个盘子开 16 个并发和
  #    开 32 个并发，每分钟下完的总字节数完全一样。并发数唯一决定的是
  #    **单集要下多久**。
  #
  # ⚠️ TV 侧必须自己算一遍，别直接套电影侧的结论：
  #    电影侧降并发的主因是"P90 片 11.75GB × 32 并发 = 单片 56 分钟，逼近
  #    vidlink 签名直链的小时级时效窗口"。TV 单集只有 1~3GB：
  #      | max_workers | 每集带宽 | 1GB 集 | 3GB 集 |
  #      |     32（旧） |  3.5MB/s | 4.8 分 | 14.6 分 |
  #      |     16（今） |    7MB/s | 2.4 分 |  7.1 分 |
  #    两档都远离过期窗口 —— **过期风险不是 TV 侧降并发的理由**。
  #
  # 📌 TV 侧真正的理由是**全局连接数**：它与 segment_concurrency 相乘
  #    （见下方 segment_concurrency 注释），32 × 64 = 2048 条并发 HTTPS 是
  #    电影侧已确诊会触发源站 429 熔断的量级。降到 16 × 16 = 256 条。
  #    单集耗时顺带减半，属白捡的收益。
  #
  # 📌 实跑校准方向（容易搞反，务必看清）：
  #   - 实际带宽**吃不满** 111MB/s → 瓶颈在源站不在本机 → 应**调大**并发；
  #   - 实际带宽**已打满**、但单集耗时过长 → 应**调小**并发。
  #   用 nload / iftop 看真实占用，别靠感觉。改本值时记得同步
  #   download_queue_depth（= 本值 × 2）。
  # 🧪 2026-09-15 实验：小样本实测网卡仅 9MB/s、单连接 ~30KB/s，瓶颈在源站
  #    而非本机带宽 → 按上面"吃不满则调大"的口径，临时恢复 32 × 64 = 2048 条
  #    验证是否存在单 IP 限速 / 会否再触发 429。结论出来后再定终值。
  # 🧪 2026-09-15 实测结论：单 IP 限速**已排除**（同 IP 128 条连接总吞吐 97~165MB/s，
  #    随连接数线性增长、0 个 429）；瓶颈是**按文件**的 CloudFront 冷回源（单个
  #    冷文件不论并发多少都在 ~35-40MB/s 封顶）→ 只有多集并行才能叠加吞吐，
  #    故 32 → 64。download_queue_depth 同步 ×2。
  # 🧪 2026-09-15 回退：64 × mp4_concurrency 64 ≈ 1400 条并发 Range 打向
  #    hakunaymatata 源站后，直连/住宅代理/家宽三个不相干出口**同时**收到源站
  #    nginx 的 429（TTFB 3~34s），35 分钟 0 集完成、网卡仅 8MB/s。说明压的是
  #    源站全局配额而非单 IP，代理池无解 → max_workers 回 32、mp4_concurrency 回 16。
  max_workers: 32          # 同时下载的集数
  # 主循环同时持有的“下载 future”上限（分批投递深度），必须 > max_workers。
  # 一次性把整轮几万集全部 submit 会让 wait(FIRST_COMPLETED) 每次都对全部
  # 未完成 future 挂/摘 waiter，主循环退化成 O(N²)；分批后 wait 规模恒定。
  # 留空/不配时默认 max_workers × 2。
  download_queue_depth: 64
  # 流式来源（pipeline.py：取流↔下载同进程重叠）下，「在途任务已排空但取流
  # 还没产出新集」时的轮询间隔（秒）。只有这一种情况才会 sleep —— 此刻主循环
  # 无事可做，不让出 CPU 就是 100% 空转。
  # ⚠️ TV 侧取流要先做季集展开（全新部署约 2.5 小时且无任何产出），期间下载侧
  # 会长期停在这个分支上，故这个值不能太小（否则空转唤醒太频繁）。
  # 单独跑 download_tv.py（非 pipeline 模式）时这段逻辑永不触发。
  stream_idle_poll_seconds: 2
  # ---- pipeline.py 专用（取流↔下载同进程重叠）----
  # 仅 `python pipeline.py` 读取；单独跑 tv_ids_to_links.py / download_tv.py 时无影响。
  pipeline:
    # 取流→下载的队列容量（集）。满了之后取流侧入队会阻塞，天然形成反压。
    # 取流才是瓶颈（每集要打多个 provider，而有源率只有个位数百分比），
    # 队列长期偏空，这个上限基本碰不到 —— 它是保险丝，不是主调节手段。
    #
    # ⚠️ 这一判断与电影侧**刻意不同**，别照搬它的结论：电影侧 2026-09-13
    # 按实测带宽重算后推翻了"取流是瓶颈"（下载 3.2 部/分钟 < 取流 4.6 部/分钟），
    # 其队列打满是**预期状态**。TV 侧结论仍然相反，因为两侧的成本结构不同：
    #   - 取流侧：TV 每集要打 3 家 provider，而集级有源率只有 9.7%，
    #     绝大部分请求是在为"判死"付费；电影侧一部片取一条链接就走。
    #   - 下载侧：TV 单集只有 1~3GB，电影中位数 2.08GB、P90 达 11.75GB。
    # ⚠️ 但 2026-09-14 下载并发已由 32 降到 16，下载侧变慢了一档 ——
    #    这个判断需要在 §0.0 ③ 全量重跑时用实际队列水位复核。
    #
    # ⚠️ 队列里每一条都是**等待下载的签名直链**，vidlink 的 mp4 直链带时效：
    # 容量越大 = 取流可以跑在下载前面越多 = 队首那条等得越久。
    # 故本值真正决定的不是吞吐（正常时队列本就偏空），而是**下载侧出故障
    # 积压到上限时，最坏能坏到什么程度**。
    #
    # 📌 若发现队列频繁打满：正确的反应是查"下载侧为什么跟不上"，
    # **不是**把本值调大 —— 调大只会让更多直链一起等到过期。
    queue_maxsize: 512
    # 队列满时，取流侧单条入队的最长等待（秒）。
    # 超时只是**推迟**不是丢失：结果早已落盘 results.jsonl（落盘先于入队），
    # 下次运行照样读得到，只是本次运行的下载侧看不到它。
    # 必须有上限——写成无限等会让取流线程在队列满时永久挂死，Ctrl+C 都退不出去。
    enqueue_timeout_seconds: 120
  # 独立的 FFmpeg 转封装线程数。转封装是 `ffmpeg -c copy` 纯 IO 拷贝，并发过高
  # 只会在同一块盘上互抢 IO，吞吐不升反降。
  convert_workers: 8
  # 单集同时下载的分片数。
  #
  # 🔴 2026-09-14 由 64 降到 16，与电影侧对齐。它是**每集各开一个**
  # ThreadPoolExecutor（见 download_segments），故全局连接数 = max_workers × 本值：
  #     旧：32 × 64 = **2048** 条并发 HTTPS 连接
  #     新：16 × 16 = **256** 条
  # 2048 条连接分 111MB/s 的带宽，每条只有 54KB/s —— 比拨号还慢，且源站极可能
  # 把这种连接数当成攻击行为（电影侧已因此吃过 429 熔断，见下方
  # mp4_host_circuit_threshold 记录的整机故障）。
  # 连接数不是越多越快：总带宽定死时，多开的连接只是把同一块蛋糕切得更碎。
  # 🧪 2026-09-15 实验：临时恢复 64（配合 max_workers 32 = 2048 条），理由见
  #    max_workers 处注释。实测若再触发 429 或吞吐不随连接数线性增长，即回退 16。
  segment_concurrency: 64
  # 画质探测与分片重试
  # 每个候选流取“影片正中间”连续 sample_count 段测码率：片头常是 logo/黑场等
  # 低动态画面、码率系统性偏低，会误杀压线的合格片。采样片单独成文件、测完即删、
  # 不复用为正片（中间采样接不成连续前缀），正片仍从第 0 段完整下载。
  # 候选流按声明高度降序试，一旦选中某流，声明高度更低的流直接跳过、不再采样。
  sample_count: 10
  seg_retry_max: 20
  seg_retry_delay: 1
  # 采样阶段的分片重试预算，与正片**分层**。
  # 采样只为测码率/分辨率来决定"这条候选流要不要"，探不到换下一条流即可；
  # 正片才是"这一集最后的希望"，值得死磕 20 次。
  # 共用 20 的后果（电影侧实跑）：源站持续吐 400/502 时单条流采样耗 35 分钟。
  # TV 侧放大效应更大——一部剧几十上百集 × 每集四档候选流，**占死的下载窗口
  # 会让本可成功的集被饿死**，直接压低下载成功率。
  # 🔴 2026-09-14 由 3 提到 5，与电影侧对齐（同批把 download_tv.py 里 urllib3
  # 层的 status_forcelist 清空，状态码重试全部收归上层）。
  # 改前的 3 是在 urllib3 仍会静默重试 2 次的前提下定的——那时一次循环底下
  # 实际有 3 个请求，3 次循环 ≈ 9 个。现在一次循环就是 1 个请求，3 次就真的
  # 只试 3 次，对源站几秒级抖动容错太弱、会压低成功率。
  # 提到 5 后实际请求数 5 < 改动前的 9，成本仍是降的；退避 1+2+4+8 ≈ 15s
  # 足以跨过短抖动，又远低于正片那套（封顶 60s）。
  sample_seg_retry_max: 5
  # 转封装(ffmpeg -c copy)单片超时(秒)：单集通常 20~60 分钟，比电影短，1800 足够冗余
  convert_timeout: 1800
  # ---- playlist(master/media)解析阶段的请求重试 ----
  #
  # 🔴 2026-09-14 由 10 降到 4，与电影侧对齐（与 max_rounds 同批调整）。
  #
  # 改前的代价：退避是指数的、第 7 次起封顶 60s，跑满 10 次约
  #   1+2+4+8+16+32+60+60+60 ≈ **4 分钟**，最坏情形（两个节点都这样）更久。
  # 电影侧实跑日志里满屏 `请求重试 7/9 (HTTP 500)，61.0s 后重试` —— 而这些
  # 400/500/502 全部来自 CDN 回源故障，已实测确诊：换 IP 无效、恢复是小时级。
  # 第 3~4 次就能定论，后面 6 次纯属空耗。
  #
  # 🔑 TV 侧的放大效应更大：一部剧几十上百集，每集都可能在这里空耗 4 分钟，
  #    而**占死的下载窗口会让本可成功的集被饿死**（与 sample_seg_retry_max
  #    取 3 而非 20 是同一个理由）。
  #
  # 为什么降到 4 而不是更低：退避 1+2+4 ≈ 7 秒，仍足以跨过源站几秒级的
  # 真抖动（这正是本项存在的理由）；再低就会伤到那类本可救回的请求。
  #
  # ⚠️ 必须与 max_rounds 一起看（两者是同一问题的两面）：
  # 短尺度重试对小时级故障统统无效，真正有效的是**跨运行重试**。
  playlist_retry_max: 4           # 单节点 playlist 解析最大重试次数
  playlist_retry_backoff: 1.0     # 退避基础间隔（秒，指数退避）
  playlist_retry_backoff_max: 60.0  # 退避间隔上限（秒）
  # 多节点 fallback：非末节点用更小的重试次数快速判定坏节点并换下一个备用节点
  # ⚠️ 本值现在只比 playlist_retry_max(4) 小 1 了，分阶重试的区分度变弱 ——
  # 这是可接受的：那 4 次本身已经很短（≈7 秒），非末节点再快也省不下多少，
  # 而保留 3 能让"坏节点快速换下一个"的语义继续成立。
  playlist_retry_fallback: 3
  # ---- mp4 直链下载（vidlink 等 type=mp4 的取流条目）----
  # 按 Range 分块并发下载，单块失败按 seg_retry_max/seg_retry_delay 重试；不做断点续传
  # （残留文件视为脏数据整段重下，启动时 temp_* 也会被清理）。
  # 请求头使用取流阶段记录的 headers（如 okhttp UA），并去掉 Session 默认的 Referer/X-Requested-With。
  # 直链 403/410 视为签名过期，标记“需重新取流”；它与非 206 / 404 / 416 /
  # 首块非视频内容一样属确定性失败——本脚本读的是固化的 results.jsonl，没有
  # 重新取流的能力，多轮重投拿到的还是同一条 url，必然再挂。故一律不重试、
  # 直接换下一个节点，并留在 failed.jsonl 里等重跑 tv_ids_to_links.py 修复。
  # 内存估算：每集最多 (mp4_concurrency 在途 + 2×mp4_concurrency 已下完待落盘) × mp4_chunk_size
  #   ≈ 3 × 8 × 8MB = 192MB；全局上限再乘 max_workers（32 → 约 6GB，仅在所有 worker 同时
  #   跑 mp4 直链且乱序严重时才会逼近）。内存紧张时优先调小 mp4_concurrency 或 mp4_chunk_size。
  mp4_chunk_size: 8388608   # 单块大小（字节），默认 8MB
  # 🧪 2026-09-15 实验：8 → 64。小样本实测当前批次 21/22 集走直链，本值才是
  #    有效连接数的杠杆（segment_concurrency 只管 HLS）。内存上限按上式重算：
  #    3 × 64 × 8MB ≈ 1.5GB/集，× 32 集 ≈ 48GB，128G 机器可承受但需盯 RSS。
  # 🧪 2026-09-15 回退：64 被证实会把 hakunaymatata 源站打进全局 429（详见
  #    max_workers 处注释）→ 回到 16，此时对源站并发 ≈ 32 × 16 = 512。
  mp4_concurrency: 16       # 同一集内并发块数
  # 【CDN 主机级熔断】某台直链主机累计多少次 429 后，本次运行内跳过它的全部
  # mp4 节点。电影侧 2026-09-10 实测确诊：hakunaymatata 的某台主机整机故障——
  # 换 3 个住宅 IP、换新签名、冷却 30s 后**恒定** 429（Server 头是 nginx，而
  # 正常主机是 Tengine），当次 341 条 vidlink url 有 153 条指向它。
  # 没有熔断时每集都要把这台坏主机重试一遍、还跨多轮，纯属空耗。
  #
  # TV 侧场景完全对应：vidlink 的 CDN 域名高度集中（实测命中分布
  # bcdn 123 / bcdn4 26 / hcdn3 18 / bcdnxw 4），一台坏主机会牵连成百上千集。
  #
  #   - 只作用于 mp4 直链；m3u8 分片层的 429 仍按限流退避重试，语义不变；
  #   - 只跳过该主机的节点，其余节点（含同域其它主机）照常尝试；
  #   - **不判整集死**，整集仍进下一轮重投（主机恢复了还能救回）；
  #   - 计数只存活于本次运行，不落盘（主机故障是临时状态）。
  # 取 3 足以区分"偶发限流"（退避后恢复）与"整机故障"（次次复现）。
  # ⚠️ 这是**省时间**的优化，不提升成功率——它只是让注定失败的请求早点放弃。
  mp4_host_circuit_threshold: 3
  # 【HLS 分片主机级 5xx 熔断】m3u8 分片层的对应机制。2026-09-15 实测：vidup/vidfast
  # 的 moon/sun.peakstorm.top 整机故障，换 IP、冷却后**恒定** 502/500，恢复是小时级。
  # 没有熔断时每个分片按 seg_retry_max=20 指数退避死磕（累计 ≈ 10 分钟），一集
  # segment_concurrency 个槽位全部空转；max_workers 开到 64 后这种空耗能把整机
  # 吞吐拖到个位数 MB/s。
  #   - 计**连续** 5xx（500/502/503/504）次数，任一分片成功即清零——健康主机偶发
  #     几次 502 不会被误伤，真死的主机没有成功来清零、第一波请求内就达阈值；
  #   - 触发后整集立刻失败并换节点（不是逐片跳过，避免产出残件再被缺片保护判死）；
  #   - 只跳过该主机的 m3u8 节点 / 不判整集死（下一轮重投主机恢复了还能救回）/
  #     计数只存活于本次运行。
  m3u8_host_circuit_threshold: 8
  # 画质预检样本大小（字节）：整片下载前先取头部这么多字节，用 ffprobe 读 moov
  # 判分辨率/编码/时长，码率 = Range 探测到的总长 × 8 / 时长。判定口径与下完整片
  # 后完全一致，却只花几 MB —— 避免 1~3GB 的整集下完才发现码率不达标而白丢。
  # moov 在文件尾部（非 faststart）时探测失败，此时放行走整片下载后再验，不误杀。
  # 只对 total_size > mp4_sample_size×2 的文件预检：更小的文件采样等于整片下两遍。
  mp4_sample_size: 8388608
  # 预检时长优先取上游 runtime_minutes（TMDB 元数据，可信的整片时长）。仅当它缺失
  # 才回退到样本探测，且样本时长低于此值（秒）时视为"疑似样本自身时长而非整片时长"
  # —— 用它当分母会让码率虚高几十倍、预检形同虚设，故判为不可信并放行整片下载。
  mp4_min_trusted_duration: 600
  # ==== 画质筛选（防误杀重设计；2026-09-14 起与 MovieDownloader 完全同构）====
  # 【整体流程】一集的 master 里通常有多条清晰度流(variant)。对每条候选流采样测得
  #   (实测高度 h、视频编码 codec、采样码率 br)，依次过“合格判定”关；合格的
  #   流进入“择优”，最终选画质最好的一条下载。
  #
  # ⚠️ 判定由 resolution_check_enabled 分成两种模式。**码率任何时候都参与判定**，
  #    分辨率则可以整关摘除。默认（false）走下面的模式 B。
  #
  # ========== 模式 B：resolution_check_enabled: false（默认，只看码率） ==========
  #
  # 【唯一一关 · 绝对码率线】
  #     门槛 = bitrate_<codec> × leniency        ← 注意：**不乘 (h/1080)²**
  #     br ≥ 门槛 才合格。任何分辨率都卡同一条线（默认 2000×0.8 = 1600 kbps）。
  #
  #   ⚠️ 为什么必须不乘 (h/1080)² 缩放（这是本模式的关键）：
  #     那个因子本身就是分辨率在参与判定。若只关掉红线关却保留缩放，
  #     480p 的门槛会被缩到 2000×(480/1080)² ≈ 316 kbps —— 低分辨率集反而
  #     更容易过关，等于把分辨率以更隐蔽的方式又请了回来，与本模式的意图相反。
  #     不缩放后，低清流自然会因达不到绝对线而被淘汰（480p 很难有 1600 kbps）。
  #
  # 【择优】纯比采样码率。既然高度不再是画质标准，就不该由它决定“多条合格流选哪条”。
  #
  #   注：本模式下 min_resolution_height 完全不生效（红线关整关放行、
  #   master 候选也不再按声明高度预筛）；leniency 仍作用于码率门槛。
  #   另：候选流的“提前终止采样”优化在本模式下自动关闭（它的正确性依赖
  #   “择优按高度绝对优先”，纯比码率时按高度剪枝会误剪掉更优的流）。
  #   还有：探测不到分辨率时**不再判失败**——分辨率既然不参与判定，就不该因为
  #   探不到它而丢掉一条已经采好样/一集已经下完的正片，如实标注“未知分辨率”即可。
  #
  # ========== 模式 A：resolution_check_enabled: true（2026-09-14 之前的口径） ==========
  #
  # 【第 1 关 · 分辨率红线】（带 leniency 容差）
  #     h ≥ min_resolution_height × leniency  才过关，否则淘汰。
  #     容差用于救回“准红线”集（如红线 1080 时的 1072/900），避免差几像素被一刀切。
  #
  # 【第 2 关 · 码率门槛】（单一曲线，按该流自身高度平方缩放）
  #     门槛 = bitrate_<codec> × (h / 1080)² × leniency
  #     br ≥ 门槛 才合格，否则淘汰（拦掉“伪高清”：分辨率够但压得糊、码率虚低）。
  #
  # 【择优】实测高度更高的绝对优先；高度完全相同才比采样码率。
  #
  # ========== 两模式共通 ==========
  #   - codec 按视频编码分档（见下）；探测不到编码时回退 H.264 基准（最严）。
  #   - 达标用 ≥（恰好达标即保留）。
  #   - 判死账本会记下**判死当时的模式**：两种模式的门槛能差 5 倍，
  #     `--retry-dead` 复判时模式不一致就不放回（口径不可比）。切换模式后
  #     旧模式下的判死记录会被保守地继续跳过，想全部放回请删 download_dead.jsonl。
  #
  # 【升档 / 降档怎么配】
  #   - 想整体调松/调严：只改 leniency 一处（两种模式都作用）。
  #   - 想单独调某编码的码率要求：改对应 bitrate_<codec>。
  #   - 想整体换红线（如下 720p）：只改 min_resolution_height（**仅模式 A 有效**）。
  #
  # 分辨率是否参与画质判定。false（默认）=只按码率判断（模式 B）；
  # true=分辨率红线+码率门槛两关（模式 A）。码率无论如何都参与判定，故没有对应开关。
  resolution_check_enabled: false
  # 分辨率红线高度。⚠️ 仅在 resolution_check_enabled: true 时生效，默认配置下不起作用。
  min_resolution_height: 1080
  # ⚠️ leniency 是“乘在门槛/达标线上的系数”，判定为“码率 ≥ 门槛、高度 ≥ 达标线”，故：
  #   越大 → 门槛越高 → 越严格；越小 → 门槛越低 → 越宽松（更防误杀）。
  #   例：H.264 基准 2000，leniency=0.8→门槛 1600、0.9→1800（更严）、0.7→1400（更松）。
  #   名字叫 leniency（宽容度）但“越大越宽容”的字面直觉是反的，实为“门槛系数”。
  leniency: 0.8
  # 各视频编码在“1080p 基准”下的最低码率门槛（kbps）。模式 A 下按 (h/1080)² 随流
  # 高度缩放；模式 B 下不缩放，直接就是绝对线。
  # 同一主观画质下高效编码更省码率，故各设等效基准，避免用 H.264 门槛误杀高效编码的清晰流。
  # ffprobe 实测的 codec_name 会被归一到下面的键：
  #   h264/avc → h264 ；hevc/h265 → hevc ；av1/av01 → av1 ；vp9 → vp9 。
  # 未列出的编码 / 探测失败 → 回退 H.264 基准（bitrate_h264，最严）。
  # ⚠️ 四档是**等效关系**，调整时应同比例改动，否则会破坏“同主观画质”的对齐：
  #   单独抬高 h264 会让 HEVC/AV1 集相对更容易过关；单独抬高 hevc 则会误杀高效编码的清晰集。
  # 📌 2026-09-14 由 1850/1100/925/1400 等比上调到与电影侧完全一致的下列取值。
  bitrate_h264: 2000   # H.264/AVC 基准（= 2 Mbps 红线）
  bitrate_hevc: 1189   # HEVC/H.265（省约 40%）
  bitrate_av1:  1000   # AV1（省约 50%）
  bitrate_vp9:  1514   # VP9（效率介于 H.264 与 HEVC 之间）
  # 缺片保护：缺片率超过阈值则判失败（写 failed 可重下）
  max_missing_ratio: 0.02
  # 小样本豁免：总片数很少时允许至少丢这么多片而不触发阈值判定
  min_missing_allowance: 1
  # 【整集画质判死阈值】本轮尝试过的节点中，因画质不达标被确定性淘汰的比例达到
  # 该值、且无一节点下载成功时，该集直接判死（写 download_dead.jsonl 永久跳过），
  # 不再进入下一轮重投，也不再跨运行重试。
  #
  # 为什么可以用"概率"代替"逐轮求证"：分辨率声明与码率是**源站侧的固有属性**，
  # 不是随机变量——同一条 url 下一轮拿到的还是 480p。既然节点都不达标，就有充分
  # 理由推断重投同样不达标。
  #
  # ⚠️ 只统计"画质"这一类确定性淘汰（QualityRejectedError），源站 5xx / 采样抖动 /
  # 需重新取流等瞬时失败**不计入**，故源站抽风不会触发误杀。
  #
  # ⚠️ 取 1.0（最保守）的理由：
  #   1. 电视剧单集的可用节点数远少于电影，大量集只有 1~2 个节点。阈值 0.5 在
  #      "只有 2 个节点、其中 1 个画质淘汰 1 个瞬时挂"时就会判死，误杀面过大。
  #   2. TV 侧有源率只有个位数百分比，每一集都珍贵，宁可多跑一轮也不错杀。
  #
  # ✅ 电影侧已于 2026-09-13 同日对齐到 1.0（它此前是 0.5），两侧现在是
  #    **同一套判死语义**：必须确定该集在所有存在资源的节点上都画质不达标
  #    才判死，其余一律可重试。代价是放弃电影侧实测的 37% 提速——用户在
  #    "省时间"与"零误杀"之间选了后者。
  #    ⚠️ 早期注释曾写"TV 取 1.0 比电影侧的 0.5 保守"，那已过期，勿再引用。
  #
  # ⚠️ 阈值只是第一道防线。真正保证语义的是 is_quality_dead 的**第 3 道闸门**
  # （要求全部节点的 reason_class 都是画质类）：阈值 1.0 挡不住"需重新取流 + 画质"
  # 这类组合，因为那两个节点都是确定性失败、都不计入 quality_rejected_nodes。
  #
  # 取值语义：
  #   1.0  全部尝试过的节点都因画质淘汰才判死（当前，两侧一致）
  #   0.5  过半即判死（旧口径，会误杀混合场景）
  #   >1.0 等于永不判死，回到本功能上线前的乐观口径
  quality_kill_ratio: 1.0
  # 上传失败待补传清单，供 `python download_tv.py reupload` 手动补传时精确定位。
  upload_pending_log: "upload_pending.jsonl"
  # ---- S3 兼容对象存储（Cloudflare R2）上传配置 ----
  # 对象键格式：{prefix}/tv/{首播年}/{剧tmdbId}/S{季:02d}/E{集:02d}/{资产名}
  #   视频   .../S01/E03/E03.mp4
  #   元信息 .../S01/E03/meta.json
  #   字幕   .../S01/E03/subs/en.srt（由 fetch_subtitles.py 补传）
  # 键里不含上传日期：同 key 重传即幂等覆盖，且前缀可由 (tid,季,集,年) 纯计算，
  # 前端与字幕脚本都能按同前缀一次拿全该集的全部资产。
  s3:
    enabled: true
    # 敏感字段（endpoint_url/bucket/access_key/secret_key）优先从环境变量 / 同目录 .env 读取
    endpoint_url: ""         # 环境变量 R2_ENDPOINT_URL
    region: "auto"           # R2 固定用 auto
    bucket: ""               # 环境变量 R2_BUCKET
    prefix: ""               # 桶内根前缀（留空）：对象键直接从上面的 folder_prefix（tv/）开始
    access_key: ""           # 环境变量 R2_ACCESS_KEY
    secret_key: ""           # 环境变量 R2_SECRET_KEY
    upload_workers: 16       # 上传并发数
    max_pending_uploads: 64  # 反压阈值：在途上传数达到此值，新转封装完的集先在等待队列挂起（不阻塞主循环），防磁盘撑爆
    upload_retry_max: 5      # 单文件上传最大尝试次数（401/403/404、凭证/权限/桶不存在等确定性失败不重试）
    upload_retry_max_400: 2  # HTTP 400 的有限尝试次数：瞬时 400（RequestTimeout/BadDigest 等）能救回，确定性 400 只多花一轮
    upload_retry_delay: 3    # 上传重试基础间隔（秒，指数退避封顶 60s）
    connect_timeout: 15      # boto3 连接超时（秒）：默认 60s 太长，R2 抖动时会顶满反压
    read_timeout: 120        # boto3 读取超时（秒）
    # 拿不到上传槽位的集在等待队列里最多挂多久（秒）。主循环每次醒来重试提交；挂满仍
    # 拿不到说明 R2 长时间消化不动，此时降级为「不上传、成品留本地 + 写 pending」，
    # 下载与转封装继续跑，事后用 reupload 补传。等待全程不阻塞主事件循环。
    upload_slot_wait_timeout: 300
    delete_local_after_upload: true   # 上传成功后删除本地 mp4（全量必开）
  # ---- 磁盘水位监控（兜底）----
  disk_guard:
    enabled: true
    high_watermark: 0.85     # 磁盘占用达到 85% 闸住新下载
    low_watermark: 0.75      # 回落到 75% 以下恢复新下载
    check_interval: 5        # 监控线程检查间隔（秒）


# ----------------------------------------------------------------------------
# fetch_subtitles.py —— 用 SubDL 按 tmdb_id + season + episode 为各集补外挂字幕
#
# ⚠️ 本段**只有 subdl_api_key 一个可调项，且它应该留空**（见下）。
#    其余参数刻意不放在这里 —— 字幕的语种、格式、落盘路径必须与下载侧
#    **完全一致**，否则补来的字幕会落到视频找不到的地方、或格式对不上。
#    故 fetch_subtitles.py 直接复用 download_tv 段，单一事实来源：
#
#      语种白名单  <- download_tv.assets.subtitle_languages
#      输出格式    <- download_tv.assets.subtitle_formats
#      大小上限    <- download_tv.assets.subtitle_max_bytes
#      成功日志    <- download_tv.success_log
#      目录/对象键 <- download_tv.base_dir + folder_prefix
#      是否传 R2   <- download_tv.s3.enabled
#
#    **要改字幕语种/格式，请改 download_tv.assets 段，不是这里。**
#
# 字幕落点与视频同前缀：{folder_prefix}/{年}/{剧id}/S{季}/E{集}/subs/{语种}.{格式}
#
# 断点续跑的状态日志固定为脚本同目录的 subtitles.jsonl（纯观测用，
# 真正的"哪些语种已有"以 R2 上的实际对象为准，删掉它也不影响正确性）。
#
# 另有 subtitles_gaps.jsonl 是**缺口台账**：记录"SubDL 确认没有某集某语种"，
# 下次运行直接跳过该语种以省配额（免费档每账号每天仅 50 次下载，剧集按集
# 计数，额度比电影侧更紧张）。只记"源站确认没有"，取回失败的不记。
# 删掉它同样不影响正确性，代价只是下次会把这些语种再问一遍。
# ----------------------------------------------------------------------------
fetch_subtitles:
  # SubDL API Key：敏感项，**请留空**，改配到同目录 .env 的 SUBDL_API_KEY。
  # config.yaml 会进版本库，填在这里等于把 key 公开推到远端仓库；
  # .env 已被 .gitignore 排除，是唯一安全的落点（见 .env.example）。
  #
  # 支持多账号轮换以叠加额度：.env 里写 SUBDL_API_KEYS=key1,key2,key3
  # 免费申请：https://subdl.com/panel/api
  subdl_api_key: ""
