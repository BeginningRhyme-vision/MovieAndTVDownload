# ============================================================================
# TVDownloader 项目统一配置文件
# ----------------------------------------------------------------------------
# 【设计约定】
#   - 本文件按“代码文件”分段：每个顶层键对应一个 .py 脚本，段名与脚本文件名
#     （去掉 .py）一致。
#   - 每个脚本运行时只读取自己对应的那一段，互不干扰。
#   - 想改某个脚本的参数，只需改它所属段落，无需改动任何代码。
#   - 例外：pipeline.py（取流↔下载同进程重叠）不单独成段，它读 download_tv
#     段下的 pipeline 子段，并原样透传命令行参数给 tv_ids_to_links。
#
# 【与 MovieDownloader 的差异】
#   - 元数据/取流/下载的处理单位从“一部电影”变为“一集”：tmdb_id + season + episode。
#   - 季集结构以 TMDB 为准（取流阶段调 /tv/{id} 展开），IMDB episode 表仅作参考与筛选。
#   - R2 对象键：tv/{首播年}/{剧tmdbId}/S{季:02d}/E{集:02d}/E{集:02d}.mp4
#     （本地目录同构，meta.json 与 subs/ 字幕同前缀）
# ============================================================================


# ----------------------------------------------------------------------------
# fetch_tv_metadata.py —— 抓取 IMDB 全量电视剧元数据并转换 TMDB ID
# ----------------------------------------------------------------------------
fetch_tv_metadata:
  # TMDB API Key：敏感项，请配置到同目录 .env 的 TMDB_API_KEY（见 .env.example）。
  # 环境变量优先；此处留空，仅作本地调试回退。生产环境务必留空。
  tmdb_api_key: ""

  # 只保留哪些 IMDB 条目类型（title.basics 的 titleType 列）。
  # 【注意】titleType 是精确枚举字符串，代码用 isin() 精确匹配，不存在 "tv" 这种
  #   父类/通配值，写 "tv" 会匹配 0 行；必须逐个列出完整的值。
  # IMDB 官方文档只举例不枚举；据公开数据统计，titleType 实际共 11 种：
  #   非 TV（4 种）：movie / short / video / videoGame
  #   TV 前缀（7 种）：tvSeries / tvMiniSeries / tvSpecial / tvShort
  #                    / tvEpisode / tvMovie / tvPilot
  # 本段只收前 4 种，另外 3 种 TV 类型有意排除，理由：
  #   - tvEpisode：分集本身，占 title.basics 总行数 80%+；分集信息由 title.episode
  #                表展开（见 query_episodes），若收进来每部剧会重复出现几百条。
  #   - tvMovie  ：电视电影，单文件、无季集结构；TMDB Find 接口把它归到
  #                movie_results 而非 tv_results，且下游 S01/E01 下载路径不适用。
  #                应由电影版 pipeline 处理。若收进本列表，会被写入 as_movie_output
  #                旁路文件而非 output（见下方说明）。
  #   - tvPilot  ：未成剧的试播集，数量极少且大多无资源，忽略。
  # 注意：tvSpecial / tvShort 在 TMDB 里也常被建模为 movie，同样走旁路文件；
  # 保留在列表里是因为仍有相当一部分特辑在 TMDB 里挂在剧集的 Specials 季下。
  # 首次跑完后可用下面命令实际核对本地数据集中的取值分布：
  #   gzip -dc imdb_data/title.basics.tsv.gz | cut -f2 | sort | uniq -c
  keep_types:
    - tvSeries
    - tvMiniSeries
    - tvSpecial
    - tvShort

  # 调用 TMDB API 的并发线程数。TMDB 软上限约 50 req/s，配合 sleep 控制整体 QPS
  max_workers: 16

  # 每次调用 TMDB API 后的固定间隔（秒），用于降低触发限速的概率
  # 粗略估算：QPS ≈ max_workers / (请求耗时 + sleep)，按请求 ~0.2s 计，16 并发 + 0.1s 约 50 QPS，
  # 正好贴着 TMDB 软上限；若日志出现 429 可调大到 0.2（约 40 QPS）
  sleep: 0.1

  # ---- 以下为文件路径，一般无需修改 ----
  # IMDB 数据集与 SQLite 索引库所在目录（TVDownloader 独立一份，不与电影共用）
  data_dir: "imdb_data"
  # 最终输出的电视剧元数据文件（下游 filter_to_ids.py 的输入）
  output: "tv_series.jsonl"
  # 旁路输出：IMDB 标为 TV 类型但 TMDB 只在 movie_results 里有记录的条目
  # （多为 tvSpecial / tvShort）。TV pipeline 无法处理，留档给电影版 pipeline 接手。
  # 无表头 TSV，三列：imdb_id \t tmdb_movie_id \t imdb_titleType
  as_movie_output: "tv_as_movie.tsv"
  # 断点续跑的进度记录文件（记录已处理的 imdb_id）
  progress: "progress.txt"
  # 运行日志文件
  log_path: "fetch.log"


# ----------------------------------------------------------------------------
# filter_to_ids.py —— 按 filter_config.yaml 从 tv_series.jsonl 中筛出要下载的剧
# ----------------------------------------------------------------------------
filter_to_ids:
  # 输入：fetch_tv_metadata.py 的产物（应与上面 fetch_tv_metadata.output 一致）
  input: "tv_series.jsonl"
  # 筛选规则文件（各筛选项的开关与阈值都在这里，本段只管路径）
  filter_config: "filter_config.yaml"
  # 输出：通过筛选的剧 tmdb_id 列表，一行一个（应与下面 tv_ids_to_links.input 一致）
  output_ids: "ids.txt"
  # 输出：通过筛选的剧明细（不含 episodes 列表），仅供人工复核
  output_detail: "filtered.jsonl"


# ----------------------------------------------------------------------------
# tv_ids_to_links.py —— 由 tmdb_id 展开季集结构，并逐集解析出可播放的 m3u8 地址
# ----------------------------------------------------------------------------
tv_ids_to_links:
  # 输入：待解析的剧集 tmdb_id 列表（filter_to_ids.py 的产物，一行一个剧 ID）
  input: "ids.txt"
  # 剧集静态元数据源（fetch_tv_metadata.py 的产物）。取流成功时按 tmdb_id 查表，
  # 把 year/original_title/genres/title_type/imdb_id 合并进 output，
  # 供下游 download_tv 拼 R2 路径 {year}/... 及后续用途。缺失则各字段留空。
  metadata: "tv_series.jsonl"
  # 输出：解析成功的结果，一行一集（含 season/episode 与 m3u8 地址）
  output: "results.jsonl"
  # 解析失败记录：集级 tmdb_id\tseason\tepisode（真无源）；剧级 tmdb_id\t-\t-（TMDB 404）；
  # 多轮重试耗尽 tmdb_id\tseason\tepisode\tretry-exhausted（下次运行自动重试）
  fail_file: "fail.txt"
  # 季集结构缓存：TMDB /tv/{id} 展开结果，避免多轮/续跑时重复调 API
  # 每行 {tmdbId, name, year, ended, seasons:[{season, episodes, air_dates}]}；
  # air_dates 用于跳过未播集（air_date + air_grace_days 在今天之后，或未完结剧的 TBA 集），下次运行自动再试
  seasons_cache: "seasons_cache.jsonl"
  # 上架宽限期（天）：刚播出的集源站通常滞后几天才上架，此窗口内不发请求、不判死，
  # 下次运行自动纳入。设 0 则播出当天即尝试。
  air_grace_days: 5

  # TMDB API Key：用于调 /tv/{id} 拿季集结构。敏感项，走 .env 的 TMDB_API_KEY，
  # 环境变量优先；此处留空，仅作本地调试回退。
  tmdb_api_key: ""
  # 是否包含 season 0（TMDB 里的 Specials/特辑）
  include_specials: true
  # TMDB 展开阶段的并发数 / 每次请求后的间隔（秒）/ 超时 / 重试次数
  # 每部剧约 1 + ceil(季数/20) 次请求，8 并发 + 0.1s 远低于 TMDB 限速
  tmdb_workers: 8
  tmdb_sleep: 0.1
  tmdb_timeout: 15
  tmdb_retries: 3
  # TMDB 429 限流时按 Retry-After 等待的单次上限（秒），防止离谱值挂住线程
  tmdb_retry_after_max: 30
  # 缓存刷新：默认只展开未缓存的剧。在播剧后续新播出的集不会自动进缓存，
  # 需要时运行 `python tv_ids_to_links.py --refresh-ongoing`，重新展开 ended 非 true 的剧
  # （含旧格式缺 ended 字段的缓存行），以追加行覆盖旧缓存。

  # 解密服务 API 根地址（负责 enc-vidup / dec-vidup / enc-vidfast / dec-vidfast / enc-vidlink 加解密）
  api: "https://enc-dec.app/api"
  # 取流源顺序：同一次尝试内按此顺序逐家取流，首家命中即返回，不再打后面的源。
  # 某家真无源或瞬时错误都继续试下一家；全部跑完仍无 url 时，只要有任一家是瞬时错误就重试，
  # 全部真无源才算一次“疑似无源”（再走 dead_confirm 换 IP 复探）。可用：vidup / vidlink / vidfast。
  # vidup、vidfast 出 m3u8；vidlink 出带时效签名的 mp4 直链（带 quality/size，下载头 okhttp）。
  # 命令行 --providers vidlink,vidfast 可临时覆盖（如 --recheck-dead 只用新源复扫）。
  providers: [vidup, vidlink, vidfast]
  # 并发线程数：同时解析多少集。配合住宅代理分散 IP。
  # 无源404不重试，任务为纯IO等待，可拉高并发；电影版 50 实测稳定。
  # 2026-09 全量实跑：50 并发时老剧段（判死需 2 轮 × 5 server）仅 ~72 集/分钟，瓶颈在代理 RTT，
  # RSS/CPU 均无压力，提到 100 提升吞吐。
  max_workers: 100
  # 单集的最大重试次数与每次重试间隔（秒）
  # 白名单判死：只有页面 404 或全部 server 的 stream 接口 404 才算真无源(dead)；
  # 其余任何错误(SSL/超时/5xx/解密服务异常/结构异常)一律视为瞬时，重试后进入多轮捞回
  max_retries: 3
  retry_delay: 1
  # 判死二次确认：首次 404 只算“疑似无源”，换出口 IP 再完整探一次，连续两次 404 才写 fail.txt，
  # 防 CDN/代理抖动把有源集永久误判丢失；命中过 404 的集重试预算 +1。false 则单次 404 即判死。
  dead_confirm: true
  # 批量误杀熔断：连续 N 集判死且中间无一成功时，先复探 3 个历史成功集（金丝雀，优先本轮刚成功的）：
  # 有任一成功 → 上游正常、这段只是真无源，继续跑；无一成功且至少一个明确 404 → 判定 vidup/enc-dec
  # 系统性变更，回滚本窗口写入 fail_file 的 N 行并以退出码 2 终止，防止上游一坏就把整批集“正确地”永久判死。
  # 尚无任何成功集可作金丝雀、或金丝雀全是瞬时错误（限流/超时）→ 无法判断，放行继续。
  # 取值依据：实测新剧段有源率 ~14%，按剧连败最长 ~135 集；老剧段有源率接近 0 但金丝雀会放行，
  # 故 N 只影响“上游真坏时多快停下”，500 集 ≈ 100 并发下 2–3 分钟。0 关闭。--recheck-dead 模式不启用。
  dead_streak_breaker: 500
  # 死集复查：源站后补上架或历史误判的集，可运行 `python tv_ids_to_links.py --recheck-dead`
  # 只重探 fail_file 中集级真无源且至今未成功的集；成功追加 output，仍无源不重复写 fail_file。
  # ---- 多轮捞回：整批跑完后对“瞬时耗尽”的集自动重跑，直到清零或达上限 ----
  #   - 单集在 process_episode 内换 IP 重试 max_retries 次仍失败(瞬时耗尽) → 下一轮重跑；
  #   - 真无源404 → 永久排除，绝不再抓（注意：是“这一集”无源，不影响同剧其它集）；
  #   - output 直接就是全部轮次成功结果的合并。
  max_rounds: 8
  # 轮间退避：第 n 轮结束后等待 min(round_backoff*n, round_backoff_max) 秒再进入下一轮，
  # 给代理池换 IP / 源站恢复留时间。若某轮 ≥90% 且 ≥50 集都是瞬时失败（疑似代理或源站整体故障），
  # 直接等待 round_backoff_max。达 max_rounds 仍失败的集写入 fail_file 并标记
  # "retry-exhausted"（第 4 列），下次运行不视为已处理、自动重试。
  round_backoff: 30
  round_backoff_max: 300
  # 单个 HTTP 请求超时（秒）
  timeout: 12
  # 代理配置：vidup.to 有 Cloudflare 机房 IP 拦截，直连会 403，需走住宅代理。
  # 敏感项 user/password 请配置到同目录 .env 的 PROXY_USER / PROXY_PASSWORD（见 .env.example）。
  # 环境变量优先；此处 user/password 留空，仅作本地调试回退。生产环境务必留空。
  proxy:
    # true=启用下方代理，false=直连
    enabled: true
    host: "unmetered.residential.proxyrack.net"
    user: ""
    password: ""
    # 端口范围 [起, 止]，每次请求随机取一个端口以更换出口 IP
    port_range: [9000, 9050]


# ----------------------------------------------------------------------------
# download_tv.py —— 下载 m3u8 并转封装为 mp4（按集）
# ----------------------------------------------------------------------------
download_tv:
  # 输入与日志
  # 全量下载直接消费取流产物 results.jsonl（一行一集，自带 year/season/episode 等）
  input: "results.jsonl"
  success_log: "success.jsonl"
  failed_log: "failed.jsonl"
  # ---- 多轮下载：对因瞬时错误(5xx/超时/SSL/缺片等)下载失败且可重试的集自动重跑 ----
  # 确定性失败（404/无源、画质不达标、缺 tmdbId/season/episode/url）绝不进入下一轮。
  multi_round:
    enabled: true           # false=只跑一轮
    max_rounds: 3           # 最大下载轮次（含第一轮）
    cooldown_seconds: 300   # 轮次之间的冷却等待（秒）
  # 两个独立于 success.jsonl/failed.jsonl 的下载态状态文件，全程可查当前下载进度：
  #   download_ok_log   —— 累计追加，每集“下载”成功一条（不含转封装/上传）
  #   download_fail_log —— 每轮开头清空重写，只记本轮“下载”失败的集
  download_ok_log: "download_ok.jsonl"
  download_fail_log: "download_fail.jsonl"
  # 视频落盘根目录与临时工作目录。
  #   1) 相对路径（如 downloads）—— 以脚本所在目录 TVDownloader/ 为根；
  #   2) 绝对路径（如 /mnt/data/downloads）—— 直接使用该路径；
  #   3) 两者建议放在同一磁盘，成品从 temp_dir 移到 base_dir 才是瞬时操作。
  base_dir: "downloads"
  temp_dir: "temp"
  # 本地目录与 R2 对象键共用的根段，两侧严格同构：
  #   本地  {base_dir}/tv/{首播年}/{剧tmdbId}/S{季:02d}/E{集:02d}/E{集:02d}.mp4
  #   R2    {s3.prefix}/tv/{首播年}/{剧tmdbId}/S{季:02d}/E{集:02d}/E{集:02d}.mp4
  # 每集独占一个目录，meta.json 与 subs/ 字幕作为旁车资产落在同一目录下，
  # 前端按同前缀一次列举即可拿全；fetch_subtitles.py 也能由 (tid,季,集,年)
  # 纯计算出前缀，不依赖任何日志记录即可判重与补传。
  folder_prefix: "tv"
  # ---- 旁车资产（meta.json + 字幕）----
  # 尽力而为：写入/上传失败只打印告警，绝不影响整集的下载与上传结果。
  assets:
    # 是否为每集生成 meta.json（含剧集元数据 + 本次实测的分辨率/码率）。
    # 其中 subtitles[] 由 fetch_subtitles.py 补抓字幕后就地更新。
    meta_enabled: true
    # 字幕语种白名单（小写语言代码）与输出格式。
    # ⚠️ 本段是字幕的**单一事实来源**：fetch_subtitles.py 直接复用这几项，
    # 要改语种/格式请改这里，不要改 fetch_subtitles 段。
    subtitle_languages: ["en", "zh"]
    # 同时保留 VTT 与 SRT：浏览器原生 <track> 只吃 WebVTT，而多数本地播放器
    # 以 SRT 为主。字幕体积极小（几十 KB），两份都存的代价可忽略。
    subtitle_formats: ["vtt", "srt"]
    # 单个字幕文件的大小上限（字节）。防御性配置：字幕正常只有几十 KB，
    # 若源站把一个视频/错误页塞过来，不设限会把它整个读进内存。
    subtitle_max_bytes: 5242880
  # 并发控制
  max_workers: 32          # 同时下载的集数
  # 主循环同时持有的“下载 future”上限（分批投递深度），必须 > max_workers。
  # 一次性把整轮几万集全部 submit 会让 wait(FIRST_COMPLETED) 每次都对全部
  # 未完成 future 挂/摘 waiter，主循环退化成 O(N²)；分批后 wait 规模恒定。
  # 留空/不配时默认 max_workers × 2。
  download_queue_depth: 64
  # 流式来源（pipeline.py：取流↔下载同进程重叠）下，「在途任务已排空但取流
  # 还没产出新集」时的轮询间隔（秒）。只有这一种情况才会 sleep —— 此刻主循环
  # 无事可做，不让出 CPU 就是 100% 空转。
  # ⚠️ TV 侧取流要先做季集展开（全新部署约 2.5 小时且无任何产出），期间下载侧
  # 会长期停在这个分支上，故这个值不能太小（否则空转唤醒太频繁）。
  # 单独跑 download_tv.py（非 pipeline 模式）时这段逻辑永不触发。
  stream_idle_poll_seconds: 2
  # ---- pipeline.py 专用（取流↔下载同进程重叠）----
  # 仅 `python pipeline.py` 读取；单独跑 tv_ids_to_links.py / download_tv.py 时无影响。
  pipeline:
    # 取流→下载的队列容量（集）。满了之后取流侧入队会阻塞，天然形成反压。
    # 取流才是瓶颈（每集要打多个 provider，而有源率只有个位数百分比），
    # 队列长期偏空，这个上限基本碰不到 —— 它是保险丝，不是主调节手段。
    #
    # ⚠️ 队列里每一条都是**等待下载的签名直链**，vidlink 的 mp4 直链带时效：
    # 容量越大 = 取流可以跑在下载前面越多 = 队首那条等得越久。
    # 故本值真正决定的不是吞吐（正常时队列本就偏空），而是**下载侧出故障
    # 积压到上限时，最坏能坏到什么程度**。
    #
    # 📌 若发现队列频繁打满：正确的反应是查"下载侧为什么跟不上"，
    # **不是**把本值调大 —— 调大只会让更多直链一起等到过期。
    queue_maxsize: 512
    # 队列满时，取流侧单条入队的最长等待（秒）。
    # 超时只是**推迟**不是丢失：结果早已落盘 results.jsonl（落盘先于入队），
    # 下次运行照样读得到，只是本次运行的下载侧看不到它。
    # 必须有上限——写成无限等会让取流线程在队列满时永久挂死，Ctrl+C 都退不出去。
    enqueue_timeout_seconds: 120
  # 独立的 FFmpeg 转封装线程数。转封装是 `ffmpeg -c copy` 纯 IO 拷贝，并发过高
  # 只会在同一块盘上互抢 IO，吞吐不升反降。
  convert_workers: 8
  segment_concurrency: 64  # 单集同时下载的分片数
  # 画质探测与分片重试
  # 每个候选流取“影片正中间”连续 sample_count 段测码率：片头常是 logo/黑场等
  # 低动态画面、码率系统性偏低，会误杀压线的合格片。采样片单独成文件、测完即删、
  # 不复用为正片（中间采样接不成连续前缀），正片仍从第 0 段完整下载。
  # 候选流按声明高度降序试，一旦选中某流，声明高度更低的流直接跳过、不再采样。
  sample_count: 10
  seg_retry_max: 20
  seg_retry_delay: 1
  # 转封装(ffmpeg -c copy)单片超时(秒)：单集通常 20~60 分钟，比电影短，1800 足够冗余
  convert_timeout: 1800
  # ---- playlist(master/media)解析阶段的请求重试 ----
  playlist_retry_max: 10          # 单节点 playlist 解析最大重试次数
  playlist_retry_backoff: 1.0     # 退避基础间隔（秒，指数退避）
  playlist_retry_backoff_max: 60.0  # 退避间隔上限（秒）
  # 多节点 fallback：非末节点用更小的重试次数快速判定坏节点并换下一个备用节点
  playlist_retry_fallback: 3
  # ---- mp4 直链下载（vidlink 等 type=mp4 的取流条目）----
  # 按 Range 分块并发下载，单块失败按 seg_retry_max/seg_retry_delay 重试；不做断点续传
  # （残留文件视为脏数据整段重下，启动时 temp_* 也会被清理）。
  # 请求头使用取流阶段记录的 headers（如 okhttp UA），并去掉 Session 默认的 Referer/X-Requested-With。
  # 直链 403/410 视为签名过期，标记“需重新取流”；它与非 206 / 404 / 416 /
  # 首块非视频内容一样属确定性失败——本脚本读的是固化的 results.jsonl，没有
  # 重新取流的能力，多轮重投拿到的还是同一条 url，必然再挂。故一律不重试、
  # 直接换下一个节点，并留在 failed.jsonl 里等重跑 tv_ids_to_links.py 修复。
  # 内存估算：每集最多 (mp4_concurrency 在途 + 2×mp4_concurrency 已下完待落盘) × mp4_chunk_size
  #   ≈ 3 × 8 × 8MB = 192MB；全局上限再乘 max_workers（32 → 约 6GB，仅在所有 worker 同时
  #   跑 mp4 直链且乱序严重时才会逼近）。内存紧张时优先调小 mp4_concurrency 或 mp4_chunk_size。
  mp4_chunk_size: 8388608   # 单块大小（字节），默认 8MB
  mp4_concurrency: 8        # 同一集内并发块数
  # 画质预检样本大小（字节）：整片下载前先取头部这么多字节，用 ffprobe 读 moov
  # 判分辨率/编码/时长，码率 = Range 探测到的总长 × 8 / 时长。判定口径与下完整片
  # 后完全一致，却只花几 MB —— 避免 1~3GB 的整集下完才发现码率不达标而白丢。
  # moov 在文件尾部（非 faststart）时探测失败，此时放行走整片下载后再验，不误杀。
  # 只对 total_size > mp4_sample_size×2 的文件预检：更小的文件采样等于整片下两遍。
  mp4_sample_size: 8388608
  # 预检时长优先取上游 runtime_minutes（TMDB 元数据，可信的整片时长）。仅当它缺失
  # 才回退到样本探测，且样本时长低于此值（秒）时视为"疑似样本自身时长而非整片时长"
  # —— 用它当分母会让码率虚高几十倍、预检形同虚设，故判为不可信并放行整片下载。
  mp4_min_trusted_duration: 600
  # ==== 画质筛选（单一码率曲线，与 MovieDownloader 完全一致）====
  # 【第 1 关 · 分辨率红线】 h ≥ min_resolution_height × leniency
  # 【第 2 关 · 码率门槛】   br ≥ bitrate_<codec> × (h / 1080)² × leniency
  # 【择优】实测高度更高的绝对优先；高度相同才比采样码率。
  # 详细说明见 MovieDownloader/config.yaml 同名段落。
  min_resolution_height: 1080   # 分辨率红线高度（想下 720p 就改成 720，一处联动全部）
  # leniency 是“乘在门槛上的系数”：越大越严格，越小越宽松。
  leniency: 0.8
  # 各视频编码在“1080p 基准”下的最低码率门槛（kbps），实际按 (h/1080)² 随流高度缩放。
  bitrate_h264: 1850   # H.264/AVC 基准
  bitrate_hevc: 1100   # HEVC/H.265
  bitrate_av1:  925    # AV1
  bitrate_vp9:  1400   # VP9
  # 缺片保护：缺片率超过阈值则判失败（写 failed 可重下）
  max_missing_ratio: 0.02
  # 小样本豁免：总片数很少时允许至少丢这么多片而不触发阈值判定
  min_missing_allowance: 1
  # 上传失败待补传清单，供 `python download_tv.py reupload` 手动补传时精确定位。
  upload_pending_log: "upload_pending.jsonl"
  # ---- S3 兼容对象存储（Cloudflare R2）上传配置 ----
  # 对象键格式：{prefix}/tv/{首播年}/{剧tmdbId}/S{季:02d}/E{集:02d}/{资产名}
  #   视频   .../S01/E03/E03.mp4
  #   元信息 .../S01/E03/meta.json
  #   字幕   .../S01/E03/subs/en.srt（由 fetch_subtitles.py 补传）
  # 键里不含上传日期：同 key 重传即幂等覆盖，且前缀可由 (tid,季,集,年) 纯计算，
  # 前端与字幕脚本都能按同前缀一次拿全该集的全部资产。
  s3:
    enabled: true
    # 敏感字段（endpoint_url/bucket/access_key/secret_key）优先从环境变量 / 同目录 .env 读取
    endpoint_url: ""         # 环境变量 R2_ENDPOINT_URL
    region: "auto"           # R2 固定用 auto
    bucket: ""               # 环境变量 R2_BUCKET
    prefix: ""               # 桶内根前缀（留空）：对象键直接从上面的 folder_prefix（tv/）开始
    access_key: ""           # 环境变量 R2_ACCESS_KEY
    secret_key: ""           # 环境变量 R2_SECRET_KEY
    upload_workers: 16       # 上传并发数
    max_pending_uploads: 64  # 反压阈值：在途+排队上传数达到此值就阻塞下载，防磁盘撑爆
    upload_retry_max: 5      # 单文件上传最大重试次数（凭证/权限/桶不存在等确定性失败不重试）
    upload_retry_delay: 3    # 上传重试基础间隔（秒，指数退避封顶 60s）
    connect_timeout: 15      # boto3 连接超时（秒）：默认 60s 太长，R2 抖动时会顶满反压
    read_timeout: 120        # boto3 读取超时（秒）
    # 反压信号量最长等待（秒）。等满仍拿不到槽位说明 R2 长时间消化不动，此时降级为
    # 「不上传、成品留本地 + 写 pending」，下载与转封装继续跑，事后用 reupload 补传。
    # 若不设上限，R2 故障会让主事件循环无限期冻结、整条流水线停摆。
    upload_slot_wait_timeout: 300
    delete_local_after_upload: true   # 上传成功后删除本地 mp4（全量必开）
  # ---- 磁盘水位监控（兜底）----
  disk_guard:
    enabled: true
    high_watermark: 0.85     # 磁盘占用达到 85% 闸住新下载
    low_watermark: 0.75      # 回落到 75% 以下恢复新下载
    check_interval: 5        # 监控线程检查间隔（秒）


# ----------------------------------------------------------------------------
# fetch_subtitles.py —— 用 SubDL 按 tmdb_id + season + episode 为各集补外挂字幕
#
# ⚠️ 本段**只有 subdl_api_key 一个可调项，且它应该留空**（见下）。
#    其余参数刻意不放在这里 —— 字幕的语种、格式、落盘路径必须与下载侧
#    **完全一致**，否则补来的字幕会落到视频找不到的地方、或格式对不上。
#    故 fetch_subtitles.py 直接复用 download_tv 段，单一事实来源：
#
#      语种白名单  <- download_tv.assets.subtitle_languages
#      输出格式    <- download_tv.assets.subtitle_formats
#      大小上限    <- download_tv.assets.subtitle_max_bytes
#      成功日志    <- download_tv.success_log
#      目录/对象键 <- download_tv.base_dir + folder_prefix
#      是否传 R2   <- download_tv.s3.enabled
#
#    **要改字幕语种/格式，请改 download_tv.assets 段，不是这里。**
#
# 字幕落点与视频同前缀：{folder_prefix}/{年}/{剧id}/S{季}/E{集}/subs/{语种}.{格式}
#
# 断点续跑的状态日志固定为脚本同目录的 subtitles.jsonl（纯观测用，
# 真正的"哪些语种已有"以 R2 上的实际对象为准，删掉它也不影响正确性）。
#
# 另有 subtitles_gaps.jsonl 是**缺口台账**：记录"SubDL 确认没有某集某语种"，
# 下次运行直接跳过该语种以省配额（免费档每账号每天仅 50 次下载，剧集按集
# 计数，额度比电影侧更紧张）。只记"源站确认没有"，取回失败的不记。
# 删掉它同样不影响正确性，代价只是下次会把这些语种再问一遍。
# ----------------------------------------------------------------------------
fetch_subtitles:
  # SubDL API Key：敏感项，**请留空**，改配到同目录 .env 的 SUBDL_API_KEY。
  # config.yaml 会进版本库，填在这里等于把 key 公开推到远端仓库；
  # .env 已被 .gitignore 排除，是唯一安全的落点（见 .env.example）。
  #
  # 支持多账号轮换以叠加额度：.env 里写 SUBDL_API_KEYS=key1,key2,key3
  # 免费申请：https://subdl.com/panel/api
  subdl_api_key: ""
