# ============================================================================
# 电视剧筛选配置文件
# ----------------------------------------------------------------------------
# 供 filter_to_ids.py 读取，用于决定从 tv_series.jsonl 中挑出哪些电视剧去下载。
#
# 【总原则】
#   - 每个筛选项都是一个独立开关，由它自己的 enabled 控制是否生效。
#   - enabled: false 时，该项完全不参与筛选（等于放行所有电视剧）。
#   - 本文件默认把所有开关都设为 false，因此默认【不做任何筛选】，
#     tv_series.jsonl 里所有带 tmdb_id 的电视剧都会被选中。
#   - 想启用某项筛选时，把对应的 enabled 改成 true，再调下面的参数即可。
#   - 筛选粒度是“剧”（一个 tmdb_id 代表一整部剧）；具体下载哪些季/集
#     由 tv_ids_to_links.py 调 TMDB 展开，本文件不做集级筛选。
#
# 【null（缺失值）如何处理】
#   有些老剧可能没有评分、没有票数、没有时长等（字段值为 null）。
#   每个涉及数值/内容的筛选项都有一个 keep_if_missing 开关：
#     - keep_if_missing: true  -> 该字段为 null 时，视为“通过本项筛选”（保留，默认）
#     - keep_if_missing: false -> 该字段为 null 时，直接排除这部剧
# ============================================================================


# ----------------------------------------------------------------------------
# title_type: 按条目类型筛选（对应 tv_series.jsonl 的 "title_type" 字段）
#   上游 fetch_tv_metadata.py 默认保留四类：
#     tvSeries（常规剧集）、tvMiniSeries（迷你剧）、tvSpecial（特别节目）、tvShort（短剧）
#   开启后：只保留 allow 列表中的类型；不在列表中的一律排除。
#   例如只想要正剧和迷你剧，可把 tvSpecial / tvShort 从列表中删掉。
# ----------------------------------------------------------------------------
title_type:
  # 是否启用本项筛选：true=启用，false=不筛选（默认）
  enabled: false
  # 允许保留的类型白名单；只有类型在此列表中的剧才会通过
  allow:
    - tvSeries
    - tvMiniSeries
    - tvSpecial
    - tvShort


# ----------------------------------------------------------------------------
# is_adult: 是否排除成人内容（对应 "is_adult" 字段，取值 true/false）
#   开启后：根据 exclude_adult 决定是否剔除成人剧集。
# ----------------------------------------------------------------------------
is_adult:
  # 是否启用本项筛选：true=启用，false=不筛选（默认）
  enabled: false
  # true=排除掉 is_adult 为 true 的剧；false=保留成人剧
  exclude_adult: true


# ----------------------------------------------------------------------------
# start_year: 按开播年份筛选（对应 "start_year" 字段，整数）
#   开启后：只保留 min <= start_year <= max 的剧。
#   min 或 max 设为 null 表示该侧不设限（例如只设 min 就是“某年以后开播”）。
# ----------------------------------------------------------------------------
start_year:
  # 是否启用本项筛选：true=启用，false=不筛选（默认）
  enabled: false
  # 最早开播年份（含）；null 表示不限制下界。例：2000 表示 2000 年及以后
  min: 2000
  # 最晚开播年份（含）；null 表示不限制上界。例：2024
  max: null
  # 年份为 null（未知）时：true=保留，false=排除
  keep_if_missing: true


# ----------------------------------------------------------------------------
# end_year: 按完结年份筛选（对应 "end_year" 字段，整数）
#   仍在播出的剧 end_year 为 null；用 keep_if_missing 控制是否保留在播剧。
#   开启后：只保留 min <= end_year <= max 的剧。
# ----------------------------------------------------------------------------
end_year:
  # 是否启用本项筛选：true=启用，false=不筛选（默认）
  enabled: false
  # 最早完结年份（含）；null 表示不限
  min: null
  # 最晚完结年份（含）；null 表示不限
  max: null
  # end_year 为 null（未完结/未知）时：true=保留，false=排除
  keep_if_missing: true


# ----------------------------------------------------------------------------
# runtime_minutes: 按单集时长（分钟）筛选（对应 "runtime_minutes" 字段，整数）
#   IMDB 对剧集给出的是典型单集时长。可用于剔除超短的网络短剧等。
#   开启后：只保留 min <= runtime_minutes <= max 的剧。
# ----------------------------------------------------------------------------
runtime_minutes:
  # 是否启用本项筛选：true=启用，false=不筛选（默认）
  enabled: false
  # 最短单集时长（含），单位分钟；null 表示不限。例：20
  min: 20
  # 最长单集时长（含），单位分钟；null 表示不限
  max: null
  # 时长为 null（未知）时：true=保留，false=排除
  keep_if_missing: true


# ----------------------------------------------------------------------------
# rating: 按 IMDB 平均评分筛选（对应 "rating" 字段，浮点，0~10）
#   这是整部剧的评分，不是单集评分。
#   开启后：只保留 min <= rating <= max 的剧。
# ----------------------------------------------------------------------------
rating:
  # 是否启用本项筛选：true=启用，false=不筛选（默认）
  enabled: false
  # 最低评分（含）；null 表示不限。例：7.0 只要 7 分及以上
  min: 7.0
  # 最高评分（含）；null 表示不限
  max: null
  # 评分为 null（无人评分）时：true=保留，false=排除
  keep_if_missing: true


# ----------------------------------------------------------------------------
# votes: 按 IMDB 投票人数筛选（对应 "votes" 字段，整数）
#   票数太少往往是冷门剧或刷分剧，可用此项过滤。
#   开启后：只保留 min <= votes <= max 的剧。
# ----------------------------------------------------------------------------
votes:
  # 是否启用本项筛选：true=启用，false=不筛选（默认）
  enabled: false
  # 最少票数（含）；null 表示不限。例：10000
  min: 10000
  # 最多票数（含）；null 表示不限
  max: null
  # 票数为 null 时：true=保留，false=排除
  keep_if_missing: true


# ----------------------------------------------------------------------------
# total_seasons: 按季数筛选（对应 "total_seasons" 字段，整数，来自 IMDB episode 表）
#   注意：这是 IMDB 统计的季数，仅用于粗筛；实际下载以 TMDB 的季集结构为准。
#   开启后：只保留 min <= total_seasons <= max 的剧。
# ----------------------------------------------------------------------------
total_seasons:
  # 是否启用本项筛选：true=启用，false=不筛选（默认）
  enabled: false
  # 最少季数（含）；null 表示不限
  min: null
  # 最多季数（含）；null 表示不限。例：10 可避开超长篇肥皂剧
  max: 10
  # 季数为 null（IMDB 无分集数据）时：true=保留，false=排除
  keep_if_missing: true


# ----------------------------------------------------------------------------
# total_episodes: 按总集数筛选（对应 "total_episodes" 字段，整数，来自 IMDB episode 表）
#   注意：同上，仅用于粗筛，控制总下载量；实际下载以 TMDB 季集结构为准。
#   开启后：只保留 min <= total_episodes <= max 的剧。
# ----------------------------------------------------------------------------
total_episodes:
  # 是否启用本项筛选：true=启用，false=不筛选（默认）
  enabled: false
  # 最少集数（含）；null 表示不限
  min: null
  # 最多集数（含）；null 表示不限。例：200 可避开上千集的日播剧
  max: 200
  # 集数为 0 时不算缺失；只有整个字段为 null 才走这里：true=保留，false=排除
  keep_if_missing: true


# ----------------------------------------------------------------------------
# genres: 按类型/题材筛选（对应 "genres" 字段，字符串列表）
#   include：只保留至少命中其中一个类型的剧（列表为空则不生效）。
#   exclude：命中其中任意一个类型的剧会被排除。
#   两者可同时使用；先按 include 收窄，再按 exclude 剔除。
#   常见值：Action, Comedy, Drama, Horror, Documentary, Reality-TV, Talk-Show,
#           Game-Show, News, Animation ...
# ----------------------------------------------------------------------------
genres:
  # 是否启用本项筛选：true=启用，false=不筛选（默认）
  enabled: false
  # 是否忽略大小写匹配类型名：true=忽略（推荐），false=严格区分
  case_insensitive: true
  # 白名单：剧的 genres 至少包含其中之一才保留；留空 [] 表示不做包含限制
  include: []
  # 黑名单：剧的 genres 命中其中任意一个就排除；留空 [] 表示不做排除
  exclude:
    - Documentary
    - Reality-TV
    - Talk-Show
    - Game-Show
    - News
  # genres 为空/缺失时：true=保留，false=排除
  keep_if_missing: true


# ----------------------------------------------------------------------------
# directors: 按导演筛选（对应 "directors" 字段，姓名字符串列表）
#   注意：IMDB 的 crew 表对剧集给的导演通常是剧集级别，很多剧为空。
#   开启后：只保留导演命中 include 列表中任意一人的剧。
# ----------------------------------------------------------------------------
directors:
  # 是否启用本项筛选：true=启用，false=不筛选（默认）
  enabled: false
  # 是否忽略大小写匹配姓名：true=忽略（推荐），false=严格区分
  case_insensitive: true
  # 需要命中的导演姓名列表（命中任一即保留）；留空 [] 时本项不生效
  include: []
  # 导演为空/缺失时：true=保留，false=排除
  keep_if_missing: false


# ----------------------------------------------------------------------------
# writers: 按编剧筛选（对应 "writers" 字段，姓名字符串列表）
#   规则同 directors。
# ----------------------------------------------------------------------------
writers:
  # 是否启用本项筛选：true=启用，false=不筛选（默认）
  enabled: false
  # 是否忽略大小写匹配姓名：true=忽略（推荐），false=严格区分
  case_insensitive: true
  # 需要命中的编剧姓名列表（命中任一即保留）；留空 [] 时本项不生效
  include: []
  # 编剧为空/缺失时：true=保留，false=排除
  keep_if_missing: false


# ----------------------------------------------------------------------------
# title_keywords: 按标题关键词筛选
#   同时匹配 "primary_title" 和 "original_title" 两个字段，任一命中即算命中。
#   include：标题需命中其中一个关键词才保留（列表为空则不生效）。
#   exclude：标题命中其中任意一个关键词就排除。
# ----------------------------------------------------------------------------
title_keywords:
  # 是否启用本项筛选：true=启用，false=不筛选（默认）
  enabled: false
  # 是否忽略大小写：true=忽略（推荐），false=严格区分
  case_insensitive: true
  # 是否把关键词当正则表达式处理：true=正则匹配，false=普通子串包含（默认）
  use_regex: false
  # 标题需包含其中之一才保留；留空 [] 表示不做包含限制
  include: []
  # 标题命中其中任意一个就排除；留空 [] 表示不做排除
  exclude: []
